<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>个人 CRM 管理台trae ok</title>
<style>
  :root{--pri:#2563eb;--bg:#f8fafc;--card:#fff;--border:#e2e8f0;--text:#1e293b;--muted:#64748b;--ok:#16a34a;--err:#dc2626}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
  header{background:var(--card);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:10}
  header h1{font-size:18px;font-weight:600}
  header .env{color:var(--muted);font-size:12px}
  main{max-width:1100px;margin:0 auto;padding:20px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:16px}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
  input[type=text],input[type=number],input[type=date],input[type=search],select,textarea{border:1px solid var(--border);border-radius:6px;padding:6px 10px;font-size:14px;background:#fff;color:var(--text)}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pri)}
  textarea{width:100%;min-height:80px;resize:vertical}
  .btn{display:inline-flex;align-items:center;gap:4px;padding:6px 14px;border:1px solid var(--border);border-radius:6px;background:var(--card);color:var(--text);font-size:14px;cursor:pointer;white-space:nowrap}
  .btn:hover{background:#f1f5f9}
  .btn-primary{background:var(--pri);color:#fff;border-color:var(--pri)}
  .btn-primary:hover{background:#1d4ed8}
  .btn-sm{padding:3px 10px;font-size:13px}
  .btn-danger{color:var(--err);border-color:var(--err)}
  .btn-danger:hover{background:#fef2f2}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--border)}
  th{color:var(--muted);font-weight:500;font-size:13px}
  tr:hover{background:#f8fafc}
  .pager{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:12px}
  .badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:12px;background:#e0e7ff;color:#3730a3}
  .badge.stage{background:#dbeafe;color:#1e40af}
  .badge.pri-A{background:#fee2e2;color:#991b1b}.badge.pri-B{background:#fef3c7;color:#92400e}.badge.pri-C{background:#d1fae5;color:#065f46}.badge.pri-D{background:#e0e7ff;color:#3730a3}.badge.pri-E{background:#f1f5f9;color:#475569}
  .tabs{display:flex;gap:2px;border-bottom:2px solid var(--border);margin-bottom:16px}
  .tab{padding:8px 16px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;font-size:14px;color:var(--muted)}
  .tab.active{color:var(--pri);border-bottom-color:var(--pri);font-weight:500}
  .tab:hover{color:var(--pri)}
  .field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
  .field label{font-size:13px;color:var(--muted)}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media(max-width:600px){.field-row{grid-template-columns:1fr}}
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-start;justify-content:center;z-index:100;padding:40px 16px;overflow:auto}
  .modal{background:var(--card);border-radius:10px;padding:20px;width:100%;max-width:560px;box-shadow:0 8px 30px rgba(0,0,0,.15)}
  .modal h3{margin-bottom:14px;font-size:16px}
  .modal-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:10px 20px;border-radius:8px;color:#fff;font-size:14px;z-index:200;box-shadow:0 4px 12px rgba(0,0,0,.2)}
  .toast.ok{background:var(--ok)}.toast.err{background:var(--err)}
  .photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
  .photo-item{position:relative;border:1px solid var(--border);border-radius:8px;overflow:hidden;aspect-ratio:1;background:#f1f5f9}
  .photo-item img{width:100%;height:100%;object-fit:cover}
  .photo-item .del{position:absolute;top:4px;right:4px;background:rgba(255,255,255,.9);border:none;border-radius:4px;padding:2px 6px;cursor:pointer;font-size:12px;color:var(--err)}
  .ai-result{background:#f8fafc;border:1px solid var(--border);border-radius:8px;padding:12px;margin-top:8px}
  .ai-result dt{font-weight:600;color:var(--muted);font-size:13px;margin-top:8px}.ai-result dd{margin-left:0;font-size:14px}
  .loading{color:var(--muted);font-size:14px;padding:20px;text-align:center}
  .empty{color:var(--muted);font-size:14px;padding:20px;text-align:center}
  a{color:var(--pri);text-decoration:none;cursor:pointer}a:hover{text-decoration:underline}
</style>
</head>
<body>
<header>
  <h1>个人 CRM</h1>
  <span class="env" id="env-label"></span>
</header>
<main id="view"><div class="loading">初始化中…</div></main>
<div id="modal-root"></div>
<div id="toast-root"></div>
<script>window.APP_CONFIG = { envId: 'crm-d1gkae8ddc930d151' };</script>
<script src="https://static.cloudbase.net/cloudbase-js-sdk/latest/cloudbase.full.js"></script>
<script>
(function(){
'use strict';

var CONFIG = window.APP_CONFIG || {};
var app = null;

// ==================== 枚举常量 ====================
var STAGES = ['','新认识','关系维护','需求挖掘','方案沟通','成交推进','转介绍经营'];
var PRIORITIES = ['','A','B','C','D','E'];
var GOALS = ['','建立联系','约见面','邀请活动','获取家庭信息','推进签单','推进招募','推进转介绍'];

var CUSTOMER_FIELDS = [
  {name:'customer_name',label:'姓名',type:'text',req:true},
  {name:'phone',label:'电话',type:'text'},
  {name:'gender',label:'性别',type:'select',options:['','男','女','未知']},
  {name:'birthday',label:'生日',type:'date'},
  {name:'occupation',label:'职业',type:'text'},
  {name:'marital_status',label:'婚况',type:'select',options:['','未婚','已婚','未知']},
  {name:'customer_stage',label:'客户经营阶段',type:'select',options:STAGES},
  {name:'sales_priority',label:'销售优先级',type:'select',options:PRIORITIES},
  {name:'recruitment_priority',label:'招募优先级',type:'select',options:PRIORITIES},
  {name:'referral_priority',label:'转介绍优先级',type:'select',options:PRIORITIES},
  {name:'hobbies',label:'爱好',type:'text'},
  {name:'source',label:'来源',type:'text'},
  {name:'tags',label:'标签',type:'text'},
  {name:'annual_income',label:'年收入',type:'number'},
  {name:'household_income',label:'家庭收入',type:'text'},
  {name:'properties_info',label:'房产信息',type:'text'},
  {name:'first_contact_date',label:'首次接触日期',type:'date'},
  {name:'additional_info',label:'附加信息',type:'textarea'},
];

var PRODUCT_FIELDS = [
  {name:'ap_ipa',label:'重疾(IPA)'},{name:'ap_ltc',label:'长期护理(LTC)'},
  {name:'ap_ann',label:'年金(ANN)'},{name:'ap_life',label:'终身寿险(LIFE)'},
  {name:'ap_term',label:'定期寿险(TERM)'},{name:'ap_wl',label:'万能险(WL)'},
  {name:'ap_pa',label:'意外(PA)'},{name:'ap_ci',label:'医疗(CI)'},
  {name:'ap_hi',label:'健康(HI)'},{name:'ap_all',label:'总保额(ALL)'},
];

// ==================== SDK 初始化 ====================
var authInst = null;
async function initSdk(){
  if(!CONFIG.envId){
    document.getElementById('view').innerHTML = '<div class="card"><p>请在 admin.html 中设置 <code>window.APP_CONFIG.envId</code> 为你的 CloudBase 环境 ID，然后部署到静态托管。</p><p>本页面通过 <code>app.callFunction</code> 调用云函数（同域），不直连 PG，不直连 AI。</p></div>';
    return false;
  }
  document.getElementById('env-label').textContent = 'env: ' + CONFIG.envId;
  app = cloudbase.init({ env: CONFIG.envId });
  authInst = app.auth({persistence:'local'});
  // 已有登录态（本地持久化）则直接进入
  try { if(authInst.hasLoginState && authInst.hasLoginState()) return true; } catch(e){ console.warn(e); }
  await showLogin();
  return true;
}

function showLogin(){
  return new Promise(function(resolve){
    var view = document.getElementById('view');
    view.innerHTML = '';
    var card = el('div', {class:'card'});
    card.appendChild(el('h2', {}, 'CRM 登录'));
    card.appendChild(el('p', {}, '请输入账号密码登录（云开发平台的注册用户）。'));
    var form = el('form');
    var u = el('input', {type:'text', name:'username', placeholder:'用户名', autocomplete:'username'});
    var p = el('input', {type:'password', name:'password', placeholder:'密码', autocomplete:'current-password'});
    var btn = el('button', {type:'submit', class:'btn'}, '登录');
    var msg = el('div', {});
    msg.style.color = '#c0392b'; msg.style.marginTop = '8px'; msg.style.fontSize = '13px';
    form.onsubmit = async function(ev){
      ev.preventDefault();
      if(!u.value.trim() || !p.value){ msg.textContent = '请输入用户名和密码'; return; }
      btn.disabled = true; btn.textContent = '登录中…'; msg.textContent = '';
      try {
        await authInst.signInWithPassword({ username: u.value.trim(), password: p.value });
        resolve();
      } catch(e){
        msg.textContent = '登录失败：' + (e.message || e);
        btn.disabled = false; btn.textContent = '登录';
      }
    };
    var fu = el('div', {class:'field'}, [el('label', {}, '用户名'), u]);
    var fp = el('div', {class:'field'}, [el('label', {}, '密码'), p]);
    form.appendChild(fu); form.appendChild(fp); form.appendChild(btn);
    card.appendChild(form); card.appendChild(msg);
    view.appendChild(card);
  });
}

// ==================== API 封装 ====================
async function callFn(name, data){
  var res = await app.callFunction({ name: name, data: data });
  return res.result;
}

// ==================== DOM 工具 ====================
function el(tag, attrs, children){
  var n = document.createElement(tag);
  if(attrs) for(var k in attrs){
    if(k==='class') n.className = attrs[k];
    else if(k==='html') n.innerHTML = attrs[k];
    else if(k==='disabled'){ if(attrs[k]) n.disabled = true; }
    else if(k.indexOf('on')===0 && typeof attrs[k]==='function') n[k] = attrs[k];
    else n.setAttribute(k, attrs[k]);
  }
  if(children){
    if(!Array.isArray(children)) children = [children];
    children.forEach(function(c){
      if(c==null) return;
      n.appendChild(typeof c==='string' ? document.createTextNode(c) : c);
    });
  }
  return n;
}
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function toast(msg, type){
  var t = el('div', {class:'toast '+(type||'ok')}, msg);
  document.getElementById('toast-root').appendChild(t);
  setTimeout(function(){ t.remove(); }, 2800);
}
function $(id){ return document.getElementById(id); }

// ==================== 表单生成 ====================
function makeField(f, value){
  var val = value==null ? '' : value;
  var input;
  if(f.type==='textarea'){
    input = el('textarea', {name:f.name});
    input.value = val;
  } else if(f.type==='select'){
    input = el('select', {name:f.name});
    (f.options||['']).forEach(function(o){
      var opt = el('option', {value:o}, o || '(空)');
      if(o===val) opt.selected = true;
      input.appendChild(opt);
    });
  } else {
    input = el('input', {type:f.type||'text', name:f.name});
    input.value = val;
  }
  return el('div', {class:'field'}, [el('label',{},f.label+(f.req?' *':'')), input]);
}

function collectForm(modal){
  var out = {};
  modal.querySelectorAll('[name]').forEach(function(inp){
    var v = inp.value.trim();
    out[inp.name] = v;
  });
  return out;
}

function modal(title, fields, values, onSubmit){
  var overlay = el('div', {class:'modal-overlay'});
  var form = el('div', {class:'modal'});
  form.appendChild(el('h3', {}, title));
  var rows = el('div', {});
  fields.forEach(function(f, i){
    rows.appendChild(makeField(f, values ? values[f.name] : null));
    if(i%2===1 && i<fields.length-1){
      // 视觉分组：每两个字段后无特殊处理，CSS grid 处理
    }
  });
  form.appendChild(rows);
  var footer = el('div', {class:'modal-footer'}, [
    el('button', {class:'btn', onclick:function(){ overlay.remove(); }}, '取消'),
    el('button', {class:'btn btn-primary', onclick:async function(){
      var btn = this; btn.disabled = true; btn.textContent = '提交中…';
      try { await onSubmit(collectForm(form)); overlay.remove(); }
      catch(e){ toast(e.message, 'err'); }
      finally { btn.disabled = false; btn.textContent = '确定'; }
    }}, '确定'),
  ]);
  form.appendChild(footer);
  overlay.appendChild(form);
  overlay.addEventListener('click', function(e){ if(e.target===overlay) overlay.remove(); });
  document.getElementById('modal-root').appendChild(overlay);
  return overlay;
}

// ==================== 路由 ====================
function route(){
  var hash = location.hash || '#/';
  var m = hash.match(/^#\/customer\/(\d+)$/);
  if(m) return showDetail(parseInt(m[1],10));
  if(hash === '#/ai-suggestions') return showAiSuggestions();
  showList();
}

// ==================== 客户列表 ====================
var listState = { page:1, pageSize:20, keyword:'', sortField:'Id', sortDir:'desc' };

function makeSortHeader(field, label, state, rerender){
  var st = state || listState;
  var rd = rerender || showList;
  var th = el('th', {});
  th.style.cursor = 'pointer';
  th.style.whiteSpace = 'nowrap';
  var isCurrent = st.sortField === field;
  var arrow = isCurrent ? (st.sortDir === 'asc' ? ' ▲' : ' ▼') : '';
  th.onclick = function(){
    if(st.sortField === field){
      st.sortDir = st.sortDir === 'asc' ? 'desc' : 'asc';
    } else {
      st.sortField = field;
      st.sortDir = 'asc';
    }
    st.page = 1;
    rd();
  };
  th.appendChild(document.createTextNode(label + arrow));
  return th;
}

async function showList(){
  var view = $('view');
  view.innerHTML = '';

  // 搜索框：回车触发 + 搜索按钮
  var searchInput = el('input', {type:'search', placeholder:'搜索姓名/电话/职业', value:listState.keyword});
  searchInput.addEventListener('keydown', function(e){
    if(e.key === 'Enter'){
      listState.keyword = searchInput.value;
      listState.page = 1;
      showList();
    }
  });
  var toolbar = el('div', {class:'toolbar'});
  toolbar.appendChild(searchInput);
  toolbar.appendChild(el('button', {class:'btn', onclick:function(){
    listState.keyword = searchInput.value;
    listState.page = 1;
    showList();
  }}, '搜索'));
  toolbar.appendChild(el('button', {class:'btn btn-primary', onclick:function(){ openCustomerForm(null); }}, '+ 新增客户'));
  toolbar.appendChild(el('button', {class:'btn', onclick:function(){ openAiParse(); }}, 'AI 解析新增'));
  toolbar.appendChild(el('button', {class:'btn', onclick:function(){ location.hash='#/ai-suggestions'; }}, 'AI 建议'));
  view.appendChild(toolbar);

  var card = el('div', {class:'card'});
  card.appendChild(el('div', {class:'loading'}, '加载中…'));
  view.appendChild(card);

  try {
    var r = await callFn('customers', {
      action:'list', page:listState.page, pageSize:listState.pageSize,
      keyword:listState.keyword, sortField:listState.sortField, sortDir:listState.sortDir
    });
    card.innerHTML = '';
    if(!r.rows || !r.rows.length){
      card.appendChild(el('div', {class:'empty'}, '暂无客户'));
      return;
    }
    var table = el('table');

    // 表头（可排序列点击切换）
    var thead = el('thead');
    var htr = el('tr');
    htr.appendChild(el('th', {}, '姓名'));
    htr.appendChild(makeSortHeader('sales_priority', '签单优先级'));
    htr.appendChild(makeSortHeader('recruitment_priority', '招募优先级'));
    htr.appendChild(makeSortHeader('referral_priority', '转介绍优先级'));
    htr.appendChild(el('th', {}, '客户经营阶段'));
    htr.appendChild(makeSortHeader('latest_followup_date', '本次跟进日期'));
    htr.appendChild(makeSortHeader('next_followup_date', '下次跟进日期'));
    htr.appendChild(makeSortHeader('Id', '编号'));
    htr.appendChild(el('th', {}, '操作'));
    thead.appendChild(htr);
    table.appendChild(thead);

    var tbody = el('tbody');
    r.rows.forEach(function(c){
      var tr = el('tr', {}, [
        el('td', {}, el('a', {onclick:function(){ location.hash='#/customer/'+c.Id; }}, c.customer_name)),
        el('td', {}, c.sales_priority ? el('span',{class:'badge pri-'+c.sales_priority}, c.sales_priority) : '-'),
        el('td', {}, c.recruitment_priority ? el('span',{class:'badge pri-'+c.recruitment_priority}, c.recruitment_priority) : '-'),
        el('td', {}, c.referral_priority ? el('span',{class:'badge pri-'+c.referral_priority}, c.referral_priority) : '-'),
        el('td', {}, c.customer_stage ? el('span',{class:'badge stage'}, c.customer_stage) : '-'),
        el('td', {}, c.latest_followup_date ? String(c.latest_followup_date).slice(0,10) : '-'),
        el('td', {}, c.next_followup_date ? String(c.next_followup_date).slice(0,10) : '-'),
        el('td', {}, String(c.Id)),
        el('td', {}, el('a', {onclick:function(){ location.hash='#/customer/'+c.Id; }}, '详情')),
      ]);
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    card.appendChild(table);

    // 分页
    var total = r.total||0, pages = Math.ceil(total/listState.pageSize);
    if(pages>1){
      var pager = el('div', {class:'pager'});
      pager.appendChild(el('button', {class:'btn btn-sm', disabled:listState.page<=1, onclick:function(){ if(listState.page>1){listState.page--;showList();} }}, '上一页'));
      pager.appendChild(el('span', {}, listState.page+' / '+pages+'（共'+total+'）'));
      pager.appendChild(el('button', {class:'btn btn-sm', disabled:listState.page>=pages, onclick:function(){ if(listState.page<pages){listState.page++;showList();} }}, '下一页'));
      card.appendChild(pager);
    }
  } catch(e){
    card.innerHTML = '';
    card.appendChild(el('div', {class:'empty'}, '加载失败：'+esc(e.message)));
  }
}

// ==================== 客户表单 ====================
function openCustomerForm(customer){
  var isEdit = !!customer;
  modal(isEdit?'编辑客户':'新增客户', CUSTOMER_FIELDS, customer, async function(data){
    if(!data.customer_name){ toast('姓名必填','err'); return; }
    if(isEdit){
      await callFn('customers', {action:'update', id:customer.Id, data:data});
      toast('已保存');
    } else {
      var r = await callFn('customers', {action:'create', data:data});
      toast('已创建 #'+r.id);
      location.hash = '#/customer/'+r.id;
    }
    if(isEdit) showDetail(customer.Id);
  });
}

// ==================== 客户详情 ====================
var detailState = { id:null, tab:'info', data:null };

async function showDetail(id){
  detailState.id = id;
  var view = $('view');
  view.innerHTML = '';
  view.appendChild(el('div', {class:'toolbar'}, [
    el('a', {onclick:function(){ location.hash='#/'; }}, '← 返回列表'),
  ]));
  var card = el('div', {class:'card'});
  card.appendChild(el('div', {class:'loading'}, '加载中…'));
  view.appendChild(card);

  try {
    var r = await callFn('customers', {action:'get', id:id});
    if(r.error){ card.innerHTML=''; card.appendChild(el('div',{class:'empty'}, r.error)); return; }
    detailState.data = r;
    card.innerHTML = '';
    card.appendChild(el('h2', {}, r.customer.customer_name + (r.customer.phone?' · '+r.customer.phone:'')));

    // 标签栏
    var tabs = el('div', {class:'tabs'});
    var tabsDef = [['info','基本信息'],['followups','跟进记录 ('+r.followups.length+')'],['products','产品额度'],['gifts','伴手礼 ('+r.gifts.length+')'],['photos','照片 ('+r.photos.length+')'],['ai','AI 建议']];
    tabsDef.forEach(function(t){
      var tab = el('div', {class:'tab'+(detailState.tab===t[0]?' active':''), onclick:function(){ detailState.tab=t[0]; showDetail(id); }}, t[1]);
      tabs.appendChild(tab);
    });
    card.appendChild(tabs);

    var content = el('div', {});
    switch(detailState.tab){
      case 'info': content.appendChild(renderInfo(r.customer)); break;
      case 'followups': content.appendChild(renderFollowups(id, r.followups)); break;
      case 'products': content.appendChild(renderProducts(id, r.products)); break;
      case 'gifts': content.appendChild(renderGifts(id, r.gifts)); break;
      case 'photos': content.appendChild(renderPhotos(id, r.photos)); break;
      case 'ai': content.appendChild(await renderAi(id, r.recommendations)); break;
    }
    card.appendChild(content);
  } catch(e){
    card.innerHTML='';
    card.appendChild(el('div',{class:'empty'}, '加载失败：'+esc(e.message)));
  }
}

// ---------- 基本信息 ----------
function renderInfo(c){
  var box = el('div', {});
  box.appendChild(el('div', {style:'margin-bottom:12px'}, el('button', {class:'btn btn-primary btn-sm', onclick:function(){ openCustomerForm(c); }}, '编辑')));
  var dl = el('dl', {class:'ai-result'});
  CUSTOMER_FIELDS.forEach(function(f){
    var v = c[f.name];
    if(v==null||v==='') return;
    dl.appendChild(el('dt', {}, f.label));
    dl.appendChild(el('dd', {}, String(v)));
  });
  box.appendChild(dl);
  return box;
}

// ---------- 跟进记录 ----------
function renderFollowups(cid, rows){
  var box = el('div', {});
  box.appendChild(el('div', {style:'margin-bottom:12px'}, el('button', {class:'btn btn-primary btn-sm', onclick:function(){ openFollowupForm(cid, null, c2name()); }}, '+ 新增跟进')));
  if(!rows.length){ box.appendChild(el('div',{class:'empty'},'暂无跟进记录')); return box; }
  rows.forEach(function(f){
    var card = el('div', {class:'card', style:'margin-bottom:8px;padding:10px'});
    card.appendChild(el('div', {style:'display:flex;justify-content:space-between'}, [
      el('strong', {}, f.followup_date ? String(f.followup_date).slice(0,10) : '未填日期'),
      el('div', {}, [
        el('a', {class:'btn-sm', style:'margin-right:8px', onclick:function(){ openFollowupForm(cid, f, c2name()); }}, '编辑'),
        el('a', {class:'btn-sm btn-danger', onclick:async function(){
          if(!confirm('删除该跟进？')) return;
          await callFn('followups', {action:'remove', id:f.Id});
          toast('已删除'); showDetail(cid);
        }}, '删除'),
      ]),
    ]));
    if(f.followup_notes) card.appendChild(el('p', {}, f.followup_notes));
    if(f.next_followup_date||f.next_followup_goal){
      card.appendChild(el('p', {style:'color:var(--muted);font-size:13px'}, '下次：'+(f.next_followup_date?String(f.next_followup_date).slice(0,10):'')+' '+esc(f.next_followup_goal||'')));
    }
    box.appendChild(card);
  });
  return box;
  function c2name(){ return detailState.data ? detailState.data.customer.customer_name : ''; }
}

function openFollowupForm(cid, fol, customerName){
  var FIELDS = [
    {name:'followup_notes',label:'跟进内容',type:'textarea'},
    {name:'followup_date',label:'跟进日期',type:'date'},
    {name:'next_followup_date',label:'下次跟进日期',type:'date'},
    {name:'next_followup_goal',label:'下次跟进目标',type:'select',options:GOALS},
  ];
  modal(fol?'编辑跟进':'新增跟进', FIELDS, fol, async function(data){
    data.customer_id = cid;
    data.customer_name = customerName;
    if(fol){
      await callFn('followups', {action:'update', id:fol.Id, data:data});
      toast('已保存');
    } else {
      await callFn('followups', {action:'create', data:data});
      toast('已添加');
    }
    showDetail(cid);
  });
}

// ---------- 产品额度 ----------
function renderProducts(cid, rows){
  var box = el('div', {});
  var existing = rows[0] || null;
  var form = el('div', {});
  var inputs = {};
  PRODUCT_FIELDS.forEach(function(f){
    var row = el('div', {class:'field', style:'display:inline-block;width:48%;margin-right:1%'}, [
      el('label', {}, f.label),
    ]);
    var inp = el('input', {type:'number', name:f.name, placeholder:'0'});
    if(existing && existing[f.name]!=null) inp.value = existing[f.name];
    inputs[f.name] = inp;
    row.appendChild(inp);
    form.appendChild(row);
  });
  box.appendChild(form);
  box.appendChild(el('div', {style:'margin-top:12px'}, el('button', {class:'btn btn-primary btn-sm', onclick:async function(){
    var btn=this; btn.disabled=true; btn.textContent='保存中…';
    try {
      var data = {customer_id:cid};
      PRODUCT_FIELDS.forEach(function(f){ data[f.name] = inputs[f.name].value; });
      await callFn('products', {action:'upsert', data:data});
      toast('额度已保存');
    } catch(e){ toast(e.message,'err'); }
    finally { btn.disabled=false; btn.textContent='保存'; }
  }}, '保存')));
  return box;
}

// ---------- 照片 ----------
function renderPhotos(cid, rows){
  var box = el('div', {});
  var fileInput = el('input', {type:'file', accept:'image/*', style:'display:none', onchange:async function(e){
    var file = e.target.files[0]; if(!file) return;
    if(file.size > 4*1024*1024){ toast('图片过大（>4MB），请压缩后上传','err'); return; }
    var btn = uploadBtn; btn.disabled=true; btn.textContent='上传中…';
    try {
      var b = await fileToBase64(file);
      await callFn('photos', {action:'create', data:{customer_id:cid, image_base64:b.base64, content_type:b.contentType, file_name:b.fileName}});
      toast('已上传');
      showDetail(cid);
    } catch(e){ toast(e.message,'err'); }
    finally { btn.disabled=false; btn.textContent='+ 上传照片'; e.target.value=''; }
  }});
  var uploadBtn = el('button', {class:'btn btn-primary btn-sm', onclick:function(){ fileInput.click(); }}, '+ 上传照片');
  box.appendChild(el('div', {style:'margin-bottom:12px'}, [uploadBtn, fileInput]));

  if(!rows.length){ box.appendChild(el('div',{class:'empty'},'暂无照片')); return box; }
  var grid = el('div', {class:'photo-grid'});
  rows.forEach(function(p){
    var item = el('div', {class:'photo-item'});
    var loadingEl = el('div', {class:'loading', style:'font-size:12px'}, '加载…');
    item.appendChild(loadingEl);
    // 懒加载：调 photos.get 取 base64（不能用 innerHTML=''，会把删除按钮一起清掉）
    (async function(){
      try {
        var r = await callFn('photos', {action:'get', id:p.id});
        if(r.photo && r.photo.photo_url){
          var url = r.photo.photo_url;
          if(loadingEl.parentNode) loadingEl.remove();
          var img = el('img', {src:url, alt:p.file_name||'照片', title:'点击查看原图'});
          img.style.cursor = 'zoom-in';
          img.onclick = function(){ showImagePreview(url, p.file_name); };
          item.insertBefore(img, item.firstChild);
        } else {
          loadingEl.textContent = '无图';
        }
      } catch(e){ loadingEl.textContent = '加载失败'; }
    })();
    var del = el('button', {class:'del', onclick:async function(){
      if(!confirm('删除该照片？')) return;
      try { await callFn('photos', {action:'remove', id:p.id}); toast('已删除'); showDetail(cid); }
      catch(e){ toast(e.message,'err'); }
    }}, '×');
    item.appendChild(del);
    grid.appendChild(item);
  });
  box.appendChild(grid);
  return box;
}

// 点击查看原图（点击任意处关闭）
function showImagePreview(url, name){
  var overlay = el('div', {class:'modal-overlay'});
  overlay.style.alignItems = 'center';
  var box = el('div', {style:'max-width:92vw;text-align:center'});
  var img = el('img', {src:url, alt:name||'原图'});
  img.style.maxWidth = '92vw';
  img.style.maxHeight = '82vh';
  img.style.borderRadius = '8px';
  img.style.boxShadow = '0 8px 30px rgba(0,0,0,.4)';
  box.appendChild(img);
  box.appendChild(el('div', {style:'color:#fff;margin-top:8px;font-size:13px'}, (name||'') + '（点击任意处关闭）'));
  overlay.appendChild(box);
  overlay.addEventListener('click', function(){ overlay.remove(); });
  document.getElementById('modal-root').appendChild(overlay);
}

function fileToBase64(file){
  return new Promise(function(resolve, reject){
    var reader = new FileReader();
    reader.onload = function(){
      var dataUrl = reader.result;
      var parts = dataUrl.split(',');
      var base64 = parts[1] || '';
      var ct = (dataUrl.match(/^data:(.*?);/) || [,'image/jpeg'])[1];
      resolve({ base64:base64, contentType:ct, fileName:file.name });
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// ---------- AI 建议 ----------
async function renderAi(cid, recommendations){
  var box = el('div', {});
  box.appendChild(el('div', {style:'margin-bottom:12px'}, el('button', {class:'btn btn-primary btn-sm', onclick:async function(){
    var btn=this; btn.disabled=true; btn.textContent='生成中（约 1-2 分钟）…';
    try {
      var r = await callFn('ai_recommend', {customer_id:cid});
      if(r.error){ toast(r.error,'err'); return; }
      toast('建议已生成');
      showDetail(cid);
    } catch(e){ toast(e.message,'err'); }
    finally { btn.disabled=false; btn.textContent='生成 AI 跟进建议'; }
  }}, '生成 AI 跟进建议')));

  // 历史建议
  if(recommendations && recommendations.length){
    recommendations.forEach(function(rec){
      var card = el('div', {class:'card', style:'margin-bottom:8px'});
      card.appendChild(el('div', {style:'display:flex;justify-content:space-between;margin-bottom:6px'}, [
        el('strong', {}, '建议日期：'+String(rec.recommendation_date).slice(0,10)),
        rec.suggested_followup_date ? el('span', {class:'badge stage'}, '建议跟进：'+String(rec.suggested_followup_date).slice(0,10)) : null,
      ]));
      if(rec.suggested_message) card.appendChild(el('p', {}, rec.suggested_message));
      if(rec.suggested_strategy) card.appendChild(el('p', {style:'color:var(--muted);font-size:13px'}, '策略：'+esc(rec.suggested_strategy)));
      if(rec.suggested_customer_stage||rec.suggested_followup_goal){
        var tags = el('div', {style:'margin-top:6px'});
        if(rec.suggested_customer_stage) tags.appendChild(el('span',{class:'badge stage',style:'margin-right:6px'}, '阶段：'+rec.suggested_customer_stage));
        if(rec.suggested_followup_goal) tags.appendChild(el('span',{class:'badge'}, '目标：'+rec.suggested_followup_goal));
        card.appendChild(tags);
      }
      box.appendChild(card);
    });
  } else {
    box.appendChild(el('div', {class:'empty'}, '暂无 AI 建议，点击上方按钮生成'));
  }
  return box;
}

// ==================== AI 建议库（全量列表） ====================
var aiSugState = { page:1, pageSize:20, sortField:'id', sortDir:'desc' };

function shortTd(text, n){
  var s = String(text==null?'':text);
  var td = el('td', {title:s});
  td.appendChild(document.createTextNode(s.length>n ? s.slice(0,n)+'…' : (s||'-')));
  return td;
}

async function showAiSuggestions(){
  var view = $('view');
  view.innerHTML = '';
  view.appendChild(el('div', {class:'toolbar'}, [
    el('a', {onclick:function(){ location.hash='#/'; }}, '← 返回客户列表'),
    el('span', {style:'color:var(--muted);font-size:13px'}, '点击表头可排序（正序/倒序），点击客户姓名查看详情'),
  ]));
  var card = el('div', {class:'card'});
  card.appendChild(el('h3', {style:'margin-bottom:10px'}, 'AI 建议库'));
  card.appendChild(el('div', {class:'loading'}, '加载中…'));
  view.appendChild(card);

  try {
    var r = await callFn('ai_recommendations', {
      action:'listAll', page:aiSugState.page, pageSize:aiSugState.pageSize,
      sortField:aiSugState.sortField, sortDir:aiSugState.sortDir
    });
    card.innerHTML = '';
    if(!r.rows || !r.rows.length){
      card.appendChild(el('div', {class:'empty'}, '暂无 AI 建议（在客户详情页的「AI 建议」标签中生成）'));
      return;
    }
    var table = el('table');
    var thead = el('thead');
    var htr = el('tr');
    htr.appendChild(makeSortHeader('id', '序号', aiSugState, showAiSuggestions));
    htr.appendChild(makeSortHeader('customer_name', '客户姓名', aiSugState, showAiSuggestions));
    htr.appendChild(makeSortHeader('recommendation_date', '给出建议日期', aiSugState, showAiSuggestions));
    htr.appendChild(makeSortHeader('suggested_followup_date', '建议跟进日期', aiSugState, showAiSuggestions));
    htr.appendChild(el('th', {}, '建议跟进话术'));
    htr.appendChild(el('th', {}, '建议跟进策略'));
    htr.appendChild(makeSortHeader('suggested_customer_stage', '客户经营阶段', aiSugState, showAiSuggestions));
    htr.appendChild(makeSortHeader('suggested_followup_goal', '跟进目标', aiSugState, showAiSuggestions));
    thead.appendChild(htr);
    table.appendChild(thead);

    var tbody = el('tbody');
    r.rows.forEach(function(rec){
      var nameCell;
      if(rec.customer_id){
        nameCell = el('td', {}, el('a', {onclick:function(){ location.hash='#/customer/'+rec.customer_id; }}, rec.customer_name || ('#'+rec.customer_id)));
      } else {
        nameCell = el('td', {}, rec.customer_name || '-');
      }
      var tr = el('tr', {}, [
        el('td', {}, String(rec.id)),
        nameCell,
        el('td', {}, rec.recommendation_date ? String(rec.recommendation_date).slice(0,10) : '-'),
        el('td', {}, rec.suggested_followup_date ? String(rec.suggested_followup_date).slice(0,10) : '-'),
        shortTd(rec.suggested_message, 40),
        shortTd(rec.suggested_strategy, 40),
        el('td', {}, rec.suggested_customer_stage ? el('span', {class:'badge stage'}, rec.suggested_customer_stage) : '-'),
        el('td', {}, rec.suggested_followup_goal ? el('span', {class:'badge'}, rec.suggested_followup_goal) : '-'),
      ]);
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    card.appendChild(table);

    // 分页
    var total = r.total||0, pages = Math.ceil(total/aiSugState.pageSize);
    if(pages>1){
      var pager = el('div', {class:'pager'});
      pager.appendChild(el('button', {class:'btn btn-sm', disabled:aiSugState.page<=1, onclick:function(){ if(aiSugState.page>1){aiSugState.page--;showAiSuggestions();} }}, '上一页'));
      pager.appendChild(el('span', {}, aiSugState.page+' / '+pages+'（共'+total+'）'));
      pager.appendChild(el('button', {class:'btn btn-sm', disabled:aiSugState.page>=pages, onclick:function(){ if(aiSugState.page<pages){aiSugState.page++;showAiSuggestions();} }}, '下一页'));
      card.appendChild(pager);
    }
  } catch(e){
    card.innerHTML = '';
    card.appendChild(el('div', {class:'empty'}, '加载失败：'+esc(e.message)));
  }
}

// ==================== AI 解析新增 ====================
function openAiParse(){
  var overlay = el('div', {class:'modal-overlay'});
  var m = el('div', {class:'modal'});
  m.appendChild(el('h3', {}, 'AI 解析客户资料'));
  m.appendChild(el('div', {class:'field'}, [
    el('label', {}, '粘贴文本（姓名/电话/职业/生日/婚况等，可与照片一起提供）'),
    el('textarea', {name:'text', style:'min-height:240px', placeholder:'例：王五，男，1990年6月15日生，教师，未婚，电话13900000000，喜欢钓鱼'})
  ]));
  m.appendChild(el('div', {class:'field'}, [
    el('label', {}, '上传照片（可选：自动识别图中文字提取资料，照片将保存为该客户的照片）'),
    el('input', {type:'file', name:'image', accept:'image/*'}),
  ]));
  m.appendChild(el('div', {class:'modal-footer'}, [
    el('button', {class:'btn', onclick:function(){ overlay.remove(); }}, '取消'),
    el('button', {class:'btn btn-primary', onclick:async function(){
      var btn=this; btn.disabled=true; btn.textContent='解析中…';
      var ta = m.querySelector('[name=text]');
      var text = ta.value.trim();
      var fileInput = m.querySelector('[name=image]');
      var file = fileInput && fileInput.files[0];
      if(!text && !file){ toast('请输入文本或选择照片','err'); btn.disabled=false; btn.textContent='解析'; return; }
      if(file && file.size > 4*1024*1024){ toast('图片过大（>4MB），请压缩后上传','err'); btn.disabled=false; btn.textContent='解析'; return; }
      try {
        var data = { text: text };
        var photo = null;
        if(file){
          var b = await fileToBase64(file);
          data.image_base64 = b.base64;
          data.content_type = b.contentType;
          data.file_name = b.fileName;
          photo = b;
        }
        var r = await callFn('ai_parse', data);
        if(r.error){ toast(r.error,'err'); return; }
        overlay.remove();
        // 解析后的结构化字段经确认表单入库；原始输入与照片识别文字已由云函数追加到 additional_info
        openCustomerFormFromParsed(r.parsed || {}, photo);
      } catch(e){ toast(e.message,'err'); }
      finally { btn.disabled=false; btn.textContent='解析'; }
    }}, '解析'),
  ]));
  overlay.appendChild(m);
  overlay.addEventListener('click', function(e){ if(e.target===overlay) overlay.remove(); });
  document.getElementById('modal-root').appendChild(overlay);
}

function openCustomerFormFromParsed(parsed, photo){
  // 剔除仅供展示的 OCR 字段，避免污染客户字段
  if(parsed && Object.prototype.hasOwnProperty.call(parsed,'ocr_text')) delete parsed.ocr_text;
  modal('确认客户信息（AI 解析结果）', CUSTOMER_FIELDS, parsed, async function(data){
    if(!data.customer_name){ toast('姓名必填','err'); return; }
    var r = await callFn('customers', {action:'create', data:data});
    toast('已创建 #'+r.id);
    if(photo){
      try {
        await callFn('photos', {action:'create', data:{customer_id:r.id, image_base64:photo.base64, content_type:photo.contentType, file_name:photo.fileName}});
        toast('照片已保存');
      } catch(e){ toast('照片保存失败：'+e.message,'err'); }
    }
    location.hash = '#/customer/'+r.id;
  });
}

// ==================== 工具 ====================
function debounce(fn, ms){
  var t; return function(){ var a=arguments, self=this; clearTimeout(t); t=setTimeout(function(){ fn.apply(self,a); }, ms); };
}

window.addEventListener('hashchange', route);
(async function(){
  if(await initSdk()) route();
  else { /* initSdk 已渲染提示 */ }
})();
