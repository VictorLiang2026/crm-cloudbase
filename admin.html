// ==================== 候选人附件（PG 云存储 pgstore） ====================
// bucket: recruit（私有，RLS 仅 authenticated 可读写）
// 对象路径：candidate_{id}/radar_*.{ext} | candidate_{id}/winner_report_*.{ext}
// 表中存对象路径 + 原文件名，展示/下载用 createSignedUrl 临时签名链接
var RC_BUCKET = 'recruit';
var RC_FILE_KINDS = {
  radar:  { fileId: 'radar_image_file_id',   name: 'radar_image_name',   label: '竞争力评估雷达图', prefix: 'radar',         accept: 'image/*' },
  report: { fileId: 'winner_report_file_id', name: 'winner_report_name', label: '天生赢家报告',     prefix: 'winner_report', accept: '.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.jpg,.png' },
};

async function rcGetTempUrl(storedPath){
  var res = await app.storage.from(RC_BUCKET).createSignedUrl(storedPath, 3600);
  if(res.error) throw new Error(res.error.message || '获取链接失败');
  var d = res.data;
  var url = (typeof d === 'string') ? d : (d && (d.signedUrl || d.fullUrl || d.url));
  if(!url) throw new Error('获取文件链接失败');
  return url;
}

async function rcUploadFile(candidateId, kind, file){
  var cfg = RC_FILE_KINDS[kind];
  var ext = (file.name.split('.').pop() || 'bin').toLowerCase();
  var objectPath = 'candidate_' + candidateId + '/' + cfg.prefix + '_' + Date.now() + '.' + ext;
  var res = await app.storage.from(RC_BUCKET).upload(objectPath, file, {
    contentType: file.type || 'application/octet-stream',
    upsert: true,
  });
  if(res.error) throw new Error(res.error.message || '上传失败');
  var storedPath = (res.data && (res.data.id || res.data.path)) || objectPath;
  var data = {};
  data[cfg.fileId] = storedPath;
  data[cfg.name] = file.name;
  var r = await callFn('recruit_candidates', { action:'update', id: candidateId, data: data });
  if(r.error) throw new Error(r.error);
}

async function rcDeleteFile(candidateId, kind){
  var cfg = RC_FILE_KINDS[kind];
  var r0 = await callFn('recruit_candidates', { action:'get', id: candidateId });
  var storedPath = r0.candidate && r0.candidate[cfg.fileId];
  var data = {};
  data[cfg.fileId] = '';
  data[cfg.name] = '';
  var r = await callFn('recruit_candidates', { action:'update', id: candidateId, data: data });
  if(r.error) throw new Error(r.error);
  if(storedPath){
    try{ await app.storage.from(RC_BUCKET).remove([storedPath]); }catch(e2){ console.warn(e2); }
  }
}

function renderCandidateAttachments(container, c, onChanged){
  // onChanged(candidateId)：上传/删除成功后的刷新回调；不传则默认刷新详情页
  var afterChange = function(cid){ if(onChanged) onChanged(cid); else showCandidateDetail(cid); };
  container.innerHTML = '';
  container.appendChild(el('h3', {style:'margin:12px 0 4px;font-size:14px;color:var(--muted)'}, '评估附件'));
  Object.keys(RC_FILE_KINDS).forEach(function(kind){
    var cfg = RC_FILE_KINDS[kind];
    var fileId = c[cfg.fileId], fileName = c[cfg.name];
    var row = el('div', {style:'display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:6px 0;border-bottom:1px dashed var(--border)'});
    row.appendChild(el('span', {style:'font-size:13px;font-weight:600;min-width:118px'}, cfg.label));
    row.appendChild(el('span', {style:'font-size:12px;color:var(--text-secondary);max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap'}, fileId ? esc(fileName || '已上传') : '未上传'));

    if(fileId){
      row.appendChild(el('button', {class:'btn btn-sm', onclick:async function(){
        var btn = this;
        try{ btn.textContent='获取链接…'; btn.disabled=true;
          var url = await rcGetTempUrl(fileId);
          window.open(url, '_blank');
        }catch(e){ toast(e.message,'error'); }
        btn.textContent='下载'; btn.disabled=false;
      }}, '下载'));
      row.appendChild(el('button', {class:'btn btn-sm', onclick:function(){
        if(!confirm('确认删除该' + cfg.label + '记录？')) return;
        rcDeleteFile(c.candidate_id, kind).then(function(){
          toast('已删除'); afterChange(c.candidate_id);
        }).catch(function(e){ toast(e.message,'error'); });
      }}, '删除'));
    }

    var fileInput = el('input', {type:'file', accept:cfg.accept, style:'display:none'});
    var upBtn = el('button', {class:'btn btn-sm btn-primary'}, fileId ? '替换' : '上传');
    upBtn.onclick = function(){ fileInput.click(); };
    fileInput.onchange = async function(){
      var f = fileInput.files && fileInput.files[0];
      if(!f) return;
      if(kind==='radar' && f.type && f.type.indexOf('image/')!==0){ toast('请选择图片文件','error'); return; }
      upBtn.textContent='上传中…'; upBtn.disabled=true;
      try{
        await rcUploadFile(c.candidate_id, kind, f);
        toast('上传成功'); afterChange(c.candidate_id);
      }catch(e){
        toast(e.message,'error'); upBtn.textContent= fileId?'替换':'上传'; upBtn.disabled=false;
      }
      fileInput.value = '';
    };
    row.appendChild(upBtn);
    row.appendChild(fileInput);
    container.appendChild(row);

    // 雷达图内嵌预览（点击放大）
    if(kind==='radar' && fileId){
      var preview = el('div', {style:'padding:6px 0'});
      preview.appendChild(el('div', {class:'loading'}, '图片加载中…'));
      container.appendChild(preview);
      rcGetTempUrl(fileId).then(function(url){
        preview.innerHTML='';
        preview.appendChild(el('img', {src:url, style:'max-width:100%;max-height:360px;border:1px solid var(--border);border-radius:6px;cursor:zoom-in', onclick:function(){ window.open(url,'_blank'); }}));
      }).catch(function(e){
        preview.innerHTML='';
        preview.appendChild(el('div', {style:'font-size:12px;color:#dc2626'}, '图片加载失败：'+esc(e.message)));
      });
    }
  });
}

  if(isNew){
    var custRow = el('div', {style:'margin-bottom:8px'});
    custRow.appendChild(el('label', {style:'display:block;font-size:13px;color:var(--muted);margin-bottom:2px'}, '客户姓名 *（输入后离开输入框自动搜索）'));
    var custInput = el('input', {type:'text', placeholder:'输入客户姓名…', style:'width:100%;padding:6px 8px;border:1px solid var(--border);border-radius:4px;font-size:14px'});
    var custResult = el('div', {style:'display:none;margin-top:6px'});
    var selectedCust = null;

    function showCustInfo(c){
      custResult.innerHTML = '';
      custResult.style.display = 'block';
      var box = el('div', {style:'border:1px solid var(--border);border-radius:6px;padding:8px 10px;background:#f8fafc'});
      box.appendChild(el('div', {style:'font-size:13px;font-weight:600;margin-bottom:4px'}, '✓ 已关联客户：' + (c.customer_name || '')));
      var grid = el('div', {style:'display:grid;grid-template-columns:1fr 1fr;gap:2px 12px;font-size:12px;color:var(--text-secondary)'});
      [['性别', c.gender], ['电话', c.phone], ['微信', c.wx_account], ['职业', c.occupation], ['年收入', c.annual_income], ['学历', c.education], ['MBTI', c.mbti], ['来源', c.source]].forEach(function(f){
        grid.appendChild(el('div', {}, f[0] + '：' + (f[1] != null && f[1] !== '' ? String(f[1]) : '-')));
      });
      box.appendChild(grid);
      box.appendChild(el('div', {style:'font-size:11px;color:var(--muted);margin-top:4px'}, '客户基础信息只读，如需修改请到客户管理中编辑'));
      custResult.appendChild(box);
    }

    custInput.addEventListener('blur', function(){
      var kw = custInput.value.trim().toLowerCase();
      selectedCust = null;
      custResult.innerHTML = '';
      if(!kw){ custResult.style.display = 'none'; return; }
      var all = customersCache || [];
      var matches = all.filter(function(c){ return (c.customer_name || '').toLowerCase() === kw; });
      if(!matches.length){
        matches = all.filter(function(c){ return (c.customer_name || '').toLowerCase().indexOf(kw) !== -1; });
      }
      if(matches.length === 1){
        selectedCust = matches[0];
        custInput.value = matches[0].customer_name;
        showCustInfo(matches[0]);
      } else if(matches.length > 1){
        custResult.style.display = 'block';
        custResult.appendChild(el('div', {style:'font-size:13px;color:#d97706;margin-bottom:4px'}, '找到 ' + matches.length + ' 位相似客户，请点击选择：'));
        matches.slice(0, 8).forEach(function(c){
          var item = el('div', {style:'padding:6px 10px;cursor:pointer;border:1px solid var(--border);border-radius:4px;margin-bottom:4px;font-size:13px'}, (c.customer_name || '') + '（' + (c.phone || '无电话') + '）');
          item.onmousedown = function(e){ e.preventDefault(); }; // 防止 blur 抢先触发导致列表重建
          item.onclick = function(){
            selectedCust = c;
            custInput.value = c.customer_name;
            showCustInfo(c);
          };
          custResult.appendChild(item);
        });
      } else {
        custResult.style.display = 'block';
        custResult.appendChild(el('div', {style:'font-size:13px;color:#dc2626;padding:4px 0'}, '未找到对应客户，请先在客户管理中创建该客户，再来新增候选人。'));
      }
    });
    custRow.appendChild(custInput);
    custRow.appendChild(custResult);
    form.appendChild(custRow);
    inputs._customer_id = { _getCustId: function(){ return selectedCust ? selectedCust.Id : null; } };
  }

  // 增员专属字段（基础信息在客户表，这里只管增员属性）
  var fields = [
    {name:'stage', label:'阶段', type:'select', options:RC_STAGES},
    {name:'motivation', label:'求职动机', type:'textarea'},
    {name:'concerns', label:'顾虑点', type:'textarea'},
    {name:'work_experience', label:'工作经历', type:'textarea'},
    {name:'family_situation', label:'家庭情况', type:'textarea'},
    {name:'personality_tags', label:'性格标签', type:'text', placeholder:'逗号分隔，如: 外向,抗压,学习力强'},
    {name:'career_plan', label:'职业规划', type:'textarea'},
    {name:'next_action_date', label:'下次行动日期', type:'date'},
    {name:'next_action', label:'下次行动', type:'text'},
  ];

  fields.forEach(function(f){
    var row = el('div', {style:'margin-bottom:8px'});
    row.appendChild(el('label', {style:'display:block;font-size:13px;color:var(--muted);margin-bottom:2px'}, f.label));
    var input;
    if(f.type === 'select'){
      input = el('select', {style:'width:100%;padding:6px 8px;border:1px solid var(--border);border-radius:4px;font-size:14px'});
      f.options.forEach(function(o){ input.appendChild(el('option', {value:o}, o)); });
    } else if(f.type === 'textarea'){
      input = el('textarea', {style:'width:100%;padding:6px 8px;border:1px solid var(--border);border-radius:4px;font-size:14px;min-height:50px;resize:vertical'});
    } else {
      input = el('input', {type:f.type === 'date' ? 'date' : 'text', style:'width:100%;padding:6px 8px;border:1px solid var(--border);border-radius:4px;font-size:14px'});
      if(f.placeholder) input.placeholder = f.placeholder;
    }
    input.name = f.name;
    inputs[f.name] = input;
    row.appendChild(input);
    form.appendChild(row);
  });

  modal.appendChild(form);

  // 评估附件区（雷达图图片 + 天生赢家报告文档）
  // 新增态：保存候选人前无 ID，先显示提示；保存成功后在本弹窗内直接可上传
  // 编辑态：加载完候选人数据后直接渲染上传控件
  var attachWrap = el('div', {style:'margin-top:8px'});
  modal.appendChild(attachWrap);
  var createdId = null;

  function renderAttachHint(){
    attachWrap.innerHTML = '';
    var box = el('div', {style:'border:1px dashed var(--border);border-radius:6px;padding:10px;margin-top:8px;background:#f8fafc'});
    box.appendChild(el('div', {style:'font-size:13px;font-weight:600;margin-bottom:4px'}, '评估附件（竞争力评估雷达图 / 天生赢家报告）'));
    box.appendChild(el('div', {style:'font-size:12px;color:var(--muted);line-height:1.6'},
      '文件按候选人归档存储，需先保存候选人。保存成功后本窗口即可直接上传，也可稍后在候选人详情页上传。'));
    attachWrap.appendChild(box);
  }

  async function refreshAttach(candidateId){
    try{
      var r = await callFn('recruit_candidates', {action:'get', id:candidateId});
      if(r.candidate) renderCandidateAttachments(attachWrap, r.candidate, refreshAttach);
    }catch(e){ toast('附件区加载失败：' + e.message, 'error'); }
  }

  if(isNew) renderAttachHint();

  var btnRow = el('div', {style:'display:flex;gap:8px;margin-top:12px'});
  var saveBtn = el('button', {class:'btn btn-primary'}, '保存');
  var cancelBtn = el('button', {class:'btn'}, '取消');
  btnRow.appendChild(cancelBtn);
  btnRow.appendChild(saveBtn);
  modal.appendChild(btnRow);
  overlay.appendChild(modal);

  cancelBtn.onclick = function(){ overlay.remove(); };
  overlay.onclick = function(e){ if(e.target === overlay) overlay.remove(); };

  document.body.appendChild(overlay);

  // 如果是编辑，先加载现有数据
  if(!isNew){
    saveBtn.disabled = true; saveBtn.textContent = '加载中…';
    callFn('recruit_candidates', {action:'get', id:id}).then(function(r){
      saveBtn.disabled = false; saveBtn.textContent = '保存';
      if(r.candidate){
        var c = r.candidate;
        for(var k in inputs){
          if(k === '_customer_id') continue;
          if(c[k] != null) inputs[k].value = c[k];
        }
        renderCandidateAttachments(attachWrap, c, refreshAttach);
      }
    });
  }

  saveBtn.onclick = async function(){
    // 新增保存成功后的「完成」状态：关闭弹窗并进入候选人详情页
    if(createdId){
      overlay.remove();
      location.hash = '#/recruit/' + createdId;
      return;
    }
    var data = {};
    for(var k in inputs){
      if(k === '_customer_id') continue;
      data[k] = inputs[k].value.trim();
    }
    if(isNew){
      var cid = inputs._customer_id._getCustId();
      if(!cid){ toast('请先输入客户姓名并匹配到客户', 'error'); return; }
      data.customer_id = cid;
    }
    data.operator = (CONFIG.operator && CONFIG.operator.name) || 'Victor';
    saveBtn.disabled = true; saveBtn.textContent = '保存中…';
    try {
      if(isNew){
        var r = await callFn('recruit_candidates', {action:'create', data:data});
        if(r.error){ toast(r.error, 'error'); saveBtn.disabled = false; saveBtn.textContent = '保存'; return; }
        createdId = r.id;
        toast('创建成功，可继续上传评估附件');
        // 切换为「已创建-上传附件」状态：表单区收起，附件区激活
        form.style.display = 'none';
        cancelBtn.style.display = 'none';
        var banner = el('div', {style:'border:1px solid #16a34a;background:#f0fdf4;color:#15803d;border-radius:6px;padding:8px 10px;font-size:13px;margin-bottom:8px'},
          '✓ 候选人已创建。可在下方直接上传竞争力评估雷达图和天生赢家报告，传完点「完成」进入详情页。');
        modal.insertBefore(banner, attachWrap);
        saveBtn.disabled = false; saveBtn.textContent = '完成';
        refreshAttach(r.id);
      } else {
        var r = await callFn('recruit_candidates', {action:'update', id:id, data:data});
        if(r.error){ toast(r.error, 'error'); saveBtn.disabled = false; saveBtn.textContent = '保存'; return; }
        overlay.remove();
        showCandidateDetail(id);
        toast('保存成功');
      }
    } catch(e){
      toast(e.message, 'error');
      saveBtn.disabled = false; saveBtn.textContent = createdId ? '完成' : '保存';
    }
  };
}

// ==================== 启动 ====================
window.addEventListener('hashchange', route);
(async function(){
  if(await initSdk()) route();
  else { /* initSdk 已渲染提示 */ }
})();

})();
</script>
</body>
</html>
