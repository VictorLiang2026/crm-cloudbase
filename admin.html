<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Victor's CRM 管理台</title>
<style>
  :root{
    --pri:#2563eb;--pri-hover:#1d4ed8;--pri-light:#dbeafe;
    --bg:#f5f7fa;--card:#ffffff;--border:#e5e7eb;--border-light:#f1f5f9;
    --text:#0f172a;--text-secondary:#475569;--muted:#94a3b8;
    --ok:#10b981;--err:#ef4444;--warn:#f59e0b;
    --shadow:0 1px 3px rgba(0,0,0,.08);
    --radius:10px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.6;font-size:14px}
  ::selection{background:var(--pri-light)}
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:4px}
  ::-webkit-scrollbar-thumb:hover{background:#94a3b8}
  ::-webkit-scrollbar-track{background:transparent}
  .brand-badge{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#3b82f6,#1d4ed8);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0;box-shadow:0 2px 6px rgba(37,99,235,.3);letter-spacing:0}
  h2{font-size:20px;font-weight:700;line-height:1.3;margin-bottom:16px}
  h3{font-size:16px;font-weight:600}
  @keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  header{background:var(--card);border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:100;box-shadow:var(--shadow)}
  header h1{font-size:17px;font-weight:600;color:var(--text)}
  header .env{color:var(--muted);font-size:12px}
  header .user-info{margin-left:auto;display:flex;align-items:center;gap:10px;color:var(--text-secondary);font-size:13px}
  main{max-width:1200px;margin:0 auto;padding:24px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow);animation:fadeIn .25s ease}
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
  input[type=text],input[type=password],input[type=number],input[type=date],input[type=search],select,textarea{border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:14px;background:#fff;color:var(--text);transition:border-color .2s,box-shadow .2s}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px rgba(37,99,235,.1)}
  textarea{width:100%;min-height:140px;resize:vertical;line-height:1.7}
  .btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);font-size:14px;cursor:pointer;white-space:nowrap;transition:all .2s;font-weight:500}
  .btn:hover{background:#f8fafc;border-color:#cbd5e1;transform:translateY(-1px);box-shadow:0 2px 6px rgba(15,23,42,.08)}
  .btn:active{transform:translateY(0);box-shadow:none}
  .btn-primary{background:var(--pri);color:#fff;border-color:var(--pri)}
  .btn-primary:hover{background:var(--pri-hover);border-color:var(--pri-hover);box-shadow:0 2px 8px rgba(37,99,235,.3)}
  .btn-sm{padding:5px 12px;font-size:13px}
  .btn-danger{color:var(--err);border-color:var(--err);background:#fff}
  .btn-danger:hover{background:#fef2f2}
  .btn-ghost{background:transparent;border-color:transparent;color:var(--pri)}
  .btn-ghost:hover{background:var(--pri-light)}
  table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
  th{text-align:left;padding:10px 12px;border-bottom:1px solid var(--border);color:var(--text-secondary);font-weight:500;font-size:13px;background:#f8fafc}
  td{padding:12px;border-bottom:1px solid var(--border-light)}
  tr:hover{background:#f8fafc}
  .pager{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:16px}
  .badge{display:inline-block;padding:3px 10px;border-radius:6px;font-size:12px;font-weight:500;background:var(--pri-light);color:var(--pri)}
  .badge.stage{background:#dbeafe;color:#1e40af}
  .badge.pri-A{background:#fee2e2;color:#991b1b}.badge.pri-B{background:#fef3c7;color:#92400e}.badge.pri-C{background:#d1fae5;color:#065f46}.badge.pri-D{background:#e0e7ff;color:#3730a3}.badge.pri-E{background:#f1f5f9;color:#475569}
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:20px;padding-bottom:0}
  .tab{padding:10px 18px;cursor:pointer;border-bottom:2px solid transparent;font-size:14px;color:var(--text-secondary);font-weight:500;transition:all .2s;margin-bottom:-1px}
  .tab.active{color:var(--pri);border-bottom-color:var(--pri)}
  .tab:hover{color:var(--pri)}
  .field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
  .field label{font-size:13px;color:var(--text-secondary);font-weight:500}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:600px){.field-row{grid-template-columns:1fr}}
  .modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.5);display:flex;align-items:flex-start;justify-content:center;z-index:1000;padding:48px 16px;overflow:auto;overscroll-behavior:contain;backdrop-filter:blur(4px)}
  .modal{background:#fff;border-radius:12px;padding:24px;width:100%;max-width:560px;box-shadow:0 20px 60px rgba(0,0,0,.2);position:relative;z-index:1}
  .modal > *{background:inherit}
  .modal h3{margin-bottom:18px;font-size:17px;font-weight:600;background:transparent}
  .modal-footer{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;background:transparent}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:12px 24px;border-radius:8px;color:#fff;font-size:14px;z-index:2000;box-shadow:0 8px 24px rgba(0,0,0,.2);font-weight:500}
  .toast.ok{background:var(--ok)}.toast.err{background:var(--err)}
  .photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px}
  .photo-item{position:relative;border:1px solid var(--border);border-radius:10px;overflow:hidden;background:#fff;transition:box-shadow .2s;display:flex;flex-direction:column}
  .photo-item:hover{box-shadow:0 4px 12px rgba(0,0,0,.1)}
  .photo-item img{width:100%;height:140px;object-fit:cover;cursor:zoom-in;display:block}
  .photo-item .del{position:absolute;top:6px;right:6px;background:rgba(255,255,255,.95);border:none;border-radius:6px;padding:4px 8px;cursor:pointer;font-size:13px;color:var(--err);font-weight:600;z-index:2}
  .photo-item .del:hover{background:var(--err);color:#fff}
  .photo-notes{padding:8px 10px;font-size:13px;color:var(--text-secondary);flex:1;display:flex;flex-direction:column;gap:6px}
  .photo-notes-text{line-height:1.5;word-break:break-all}
  .photo-notes-empty{color:var(--muted);font-style:italic;font-size:12px}
  .photo-notes-actions{display:flex;gap:6px;margin-top:auto;padding-top:6px;border-top:1px solid var(--border-light)}
  .photo-notes-actions .btn{padding:2px 8px;font-size:12px}
  .photo-notes-actions .btn-ghost{color:var(--pri);border:none;background:transparent}
  .photo-notes-actions .btn-ghost:hover{background:var(--pri-light)}
  .photo-upload{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
  .photo-upload input[type=text]{flex:1;min-width:200px}
  .photo-filter{display:flex;gap:8px;margin-bottom:12px}
  .attach-box{height:140px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#f8fafc;border-bottom:1px solid var(--border-light);gap:8px;padding:8px}
  .attach-ext{font-size:18px;font-weight:700;color:var(--pri);background:var(--pri-light);border-radius:8px;padding:8px 16px;letter-spacing:1px}
  .attach-name{font-size:12px;color:var(--text-secondary);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px 16px}
  .product-grid .field{margin-bottom:0}
  .product-grid input[type=number]{width:100%}
  /* 保单检视二维表：一行一个险种类别，5 个字段列；浏览态/编辑态两模式 */
  .prod-table{width:100%;margin-bottom:8px;table-layout:auto}
  .prod-table th,.prod-table td{white-space:nowrap;padding:8px 10px;border-bottom:1px solid var(--border-light)}
  .prod-table th{font-size:13px;background:#f8fafc;color:var(--text-secondary);text-align:left;font-weight:600}
  .prod-table tr:last-child td{border-bottom:none}
  .prod-table td.prod-val{text-align:right;font-variant-numeric:tabular-nums;color:var(--text)}
  .prod-table td.prod-val.empty{color:var(--muted);font-style:italic}
  .prod-table .prod-cat{font-weight:600;color:var(--text);background:#f8fafc}
  /* 编辑态才显示输入框；浏览态 td 直接显示文本，不显示输入框边框 */
  .prod-table.editing input{width:100%;min-width:96px;padding:7px 10px}
  .prod-table.view-only td.prod-val input{display:none !important}
  /* 检视区域按钮行 */
  .pol-action-row{display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap}
  /* 检视报告卡片（保单 Tab 下半部分） */
  .prr-section{margin-top:24px;border-top:1px dashed var(--border-light);padding-top:16px}
  .prr-section h3{margin:0 0 12px 0;font-size:16px;display:flex;justify-content:space-between;align-items:center}
  .prr-card{border:1px solid var(--border-light);border-radius:10px;padding:14px 16px;margin-bottom:14px;background:#fff}
  .prr-card .prr-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px;flex-wrap:wrap}
  .prr-card .prr-head .badges{display:flex;gap:6px;flex-wrap:wrap}
  .prr-card .prr-head .actions{display:flex;gap:6px}
  .prr-card .prr-block{margin-top:10px}
  .prr-card .prr-block h4{margin:0 0 6px 0;font-size:13px;color:var(--text-secondary);font-weight:600}
  .prr-card .prr-block .prr-body{font-size:13.5px;line-height:1.75;color:#0f172a;white-space:pre-wrap}
  .prr-card .prr-block.gaps .prr-body{background:#fff4f2;border-left:3px solid #ef4444;padding:8px 12px;border-radius:0 8px 8px 0}
  .prr-card .prr-block.recs .prr-body{background:#f0f6ff;border-left:3px solid var(--pri);padding:8px 12px;border-radius:0 8px 8px 0}
  .prr-card .prr-block.asset .prr-body{background:#faf5ff;border-left:3px solid #8b5cf6;padding:8px 12px;border-radius:0 8px 8px 0}
  .prr-card .prr-block.next .prr-body{background:#ecfdf5;border-left:3px solid #10b981;padding:8px 12px;border-radius:0 8px 8px 0}
  .prr-card .prr-block textarea{width:100%;min-height:72px;padding:8px 10px;font-size:13.5px;line-height:1.7;resize:vertical}
  .prr-card.prr-editing .prr-body{display:none}
  .prr-editrow{display:flex;gap:8px;margin-top:12px;justify-content:flex-end}
  .parse-file-list{display:flex;flex-direction:column;gap:2px;margin-top:6px}
  .parse-file-list div{font-size:12px;color:var(--muted)}
  .parse-progress{margin-top:10px;padding:8px 12px;background:var(--pri-light);color:var(--pri);border-radius:6px;font-size:13px;font-weight:600}
  .diff-tip{font-size:13px;color:var(--text-secondary);margin:10px 0 6px}
  .diff-wrap{max-height:260px;overflow:auto;border:1px solid var(--border-light);border-radius:8px;margin-bottom:12px}
  .diff-table{width:100%;border-collapse:collapse;font-size:13px}
  .diff-table th{position:sticky;top:0;background:var(--card);text-align:left;padding:8px 10px;border-bottom:2px solid var(--border-light);color:var(--muted);font-weight:600}
  .diff-table td{padding:8px 10px;border-bottom:1px solid var(--border-light);vertical-align:top;word-break:break-all}
  .diff-field{white-space:nowrap;font-weight:600;color:#475569}
  .diff-old{color:var(--muted)}
  .diff-new{color:var(--pri);font-weight:600}
  .ocr-item{margin-bottom:12px;padding:14px}
  .ocr-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:8px}
  .ocr-time{font-weight:600;color:var(--text);font-size:14px}
  .ocr-actions{display:flex;gap:8px}
  .ocr-block{margin-bottom:10px}
  .ocr-block-label{font-size:12px;color:var(--muted);margin-bottom:4px}
  .ocr-summary{font-size:14px;color:var(--text);line-height:1.7;white-space:pre-wrap;background:#f8fafc;border:1px solid var(--border-light);border-radius:8px;padding:10px 12px}
  .ocr-raw{margin-bottom:10px}
  .ocr-raw summary{cursor:pointer;font-size:13px;color:var(--pri);font-weight:600;user-select:none}
  .ocr-raw-text{margin-top:6px;font-size:12.5px;color:var(--text-secondary);line-height:1.7;white-space:pre-wrap;background:#f8fafc;border:1px solid var(--border-light);border-radius:8px;padding:10px 12px;max-height:260px;overflow:auto;font-family:Consolas,monospace}
  .ocr-file-chips{display:flex;flex-wrap:wrap;gap:6px}
  .ocr-file-chip{max-width:100%;font-size:12.5px;color:var(--pri);background:var(--pri-light);border:none;border-radius:14px;padding:4px 12px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ocr-file-chip:hover{filter:brightness(0.96)}
  .ocr-file-chip.gone{color:var(--muted);background:#f1f5f9;cursor:default}
  .name-dup-tip{display:none;margin-top:6px;font-size:12.5px;line-height:1.6}
  .name-dup-alert{color:#e11d48;font-weight:600}
  .name-dup-link{display:block;color:var(--pri);cursor:pointer;text-decoration:underline;margin-top:2px}
  .name-dup-more{color:var(--muted);margin-top:2px}
  .ai-result{background:#f0f9ff;border:1px solid #bae6fd;border-radius:10px;padding:16px;margin-top:12px}
  .ai-result dt{font-weight:600;color:var(--text-secondary);font-size:13px;margin-top:10px}
  .ai-result dd{margin-left:0;font-size:14px;color:var(--text);line-height:1.7}
  .loading{color:var(--muted);font-size:14px;padding:24px;text-align:center}
  .empty{color:var(--muted);font-size:14px;padding:32px;text-align:center}
  a{color:var(--pri);text-decoration:none;cursor:pointer;font-weight:500}
  a:hover{text-decoration:underline}
  a:focus-visible,.btn:focus-visible,.tab:focus-visible{outline:2px solid var(--pri);outline-offset:2px;border-radius:4px}
  @media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
  input[type=text]:hover,input[type=password]:hover,input[type=number]:hover,input[type=date]:hover,input[type=search]:hover,select:hover,textarea:hover{border-color:#cbd5e1}
  .info-list{display:flex;flex-direction:column;gap:0}
  .info-row{display:flex;align-items:flex-start;gap:10px;padding:12px 0;border-bottom:1px solid var(--border-light)}
  .info-row:last-child{border-bottom:none}
  .info-row-label{font-weight:600;color:var(--text-secondary);min-width:100px;flex-shrink:0}
  .info-row-value{color:var(--text);flex:1;word-break:break-all;line-height:1.7}
  .info-row-stack{flex-direction:column;gap:6px}
  .info-row-stack .info-row-label{min-width:auto}
  .info-row-stack .info-row-value{white-space:pre-wrap;word-break:break-word;min-height:0}
  .section-title{font-size:15px;font-weight:600;color:var(--text);margin-bottom:14px;display:flex;align-items:center;gap:8px}
  .section-title::before{content:'';display:inline-block;width:3px;height:16px;background:var(--pri);border-radius:2px}
  .stat-bar{display:flex;gap:16px;margin-bottom:20px;flex-wrap:wrap}
  .stat-item{flex:1;min-width:120px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px 16px;transition:box-shadow .2s,transform .2s}
  .stat-item:hover{box-shadow:0 4px 12px rgba(0,0,0,.06);transform:translateY(-1px)}
  .stat-item .label{font-size:13px;color:var(--muted);margin-bottom:6px}
  .stat-item .value{font-size:22px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
  .stat-item .sub{font-size:12px;color:var(--ok);margin-top:4px}
  .stat-item.stat-danger .value{color:var(--err)}
  .stat-item.stat-warn .value{color:var(--warn)}
  /* ===== 今日工作台 ===== */
  .dash-date{font-size:13px;color:var(--muted);font-weight:400;margin-left:10px}
  .dash-section{margin-bottom:22px}
  .dash-section:last-child{margin-bottom:0}
  .dash-section-title{font-size:15px;font-weight:600;color:var(--text);margin-bottom:10px;display:flex;align-items:center;gap:8px}
  .dash-section-title::before{content:'';display:inline-block;width:3px;height:16px;background:var(--pri);border-radius:2px}
  .dash-section-title.tone-danger{color:var(--err)}
  .dash-section-title.tone-danger::before{background:var(--err)}
  .dash-section-title.tone-warn{color:#b45309}
  .dash-section-title.tone-warn::before{background:var(--warn)}
  .dash-section-title .count{font-size:12px;font-weight:600;background:var(--pri-light);color:var(--pri);border-radius:10px;padding:1px 9px}
  .dash-section-title.tone-danger .count{background:#fee2e2;color:#991b1b}
  .dash-section-title.tone-warn .count{background:#fef3c7;color:#92400e}
  .dash-list{display:flex;flex-direction:column;gap:8px}
  .task-card{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 14px;background:#fff;border:1px solid var(--border);border-left:3px solid var(--pri);border-radius:10px;cursor:pointer;transition:box-shadow .2s,transform .2s}
  .task-card:hover{box-shadow:0 3px 10px rgba(15,23,42,.08);transform:translateY(-1px)}
  .task-card-main{min-width:0;flex:1}
  .task-card-name{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:14px}
  .task-card-name strong{font-size:14px}
  .task-card-sub{font-size:12.5px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .task-card-date{flex-shrink:0;text-align:right;font-size:13px;font-weight:600;white-space:nowrap;line-height:1.5}
  .task-card-date small{display:block;font-weight:400;color:var(--muted);font-size:12px}
  .task-card.tc-overdue{border-left-color:var(--err);background:#fef2f2}
  .task-card.tc-overdue .task-card-date{color:var(--err)}
  .task-card.tc-today{border-left-color:var(--pri);background:#eff6ff}
  .task-card.tc-today .task-card-date{color:var(--pri)}
  .task-card.tc-week{border-left-color:#0ea5e9;background:#f0f9ff}
  .task-card.tc-week .task-card-date{color:#0369a1}
  .task-card.tc-stale90{border-left-color:var(--err);background:#fef2f2}
  .task-card.tc-stale90 .task-card-date{color:var(--err)}
  .task-card.tc-stale60{border-left-color:var(--warn);background:#fffbeb}
  .task-card.tc-stale60 .task-card-date{color:#b45309}
  .task-card.tc-stale30{border-left-color:#fbbf24;background:#fffdf2}
  .task-card.tc-stale30 .task-card-date{color:#b45309}
  .dash-all-clear{padding:28px;text-align:center;color:var(--muted);font-size:14px;background:#f8fafc;border:1px dashed var(--border);border-radius:10px}
  /* 工作台状态徽章（表格内） */
  .wb{display:inline-block;padding:3px 10px;border-radius:6px;font-size:12px;font-weight:600;white-space:nowrap}
  .wb-overdue{background:#fee2e2;color:#991b1b}
  .wb-today{background:#dbeafe;color:#1e40af}
  .wb-month{background:#e0f2fe;color:#0369a1}
  .wb-stale{background:#fef3c7;color:#92400e}
  .wb-normal{color:var(--muted);font-weight:400}
  /* 统计卡可点击筛选 */
  .stat-item.clickable{cursor:pointer}
  .stat-item.stat-active{border-color:var(--pri);box-shadow:0 0 0 2px rgba(37,99,235,.18)}
  .stat-item.clickable:hover{border-color:var(--pri)}
  /* ===== 平板 iPad（769px–1366px，覆盖 iPad Pro 12.9" 竖屏 1024 / 横屏 1366）：宽屏舒适布局 + 触控友好 ===== */
  @media (min-width:769px) and (max-width:1366px){
    main{max-width:1400px;padding:32px}
    .card{padding:24px}
    th,td{padding:13px 16px}
    .modal{max-width:680px}
    .stat-item{padding:18px 20px}
    .stat-item .value{font-size:24px}
    .btn{padding:10px 18px}
    .btn-sm{padding:9px 14px}
    .tab{padding:12px 18px}

(function(){

var CONFIG = window.APP_CONFIG || {};
var app = null;

// ==================== 枚举常量 ====================
var STAGES = ['','新认识','关系维护','需求挖掘','方案沟通','成交推进','转介绍经营'];

// 保单检视（原“产品额度”）：11 个险种类别（个人养老金 PPA 排在长期护理 LTC 之前）
// 后端表名仍为 products（兼容生产数据），仅 UI、Tab、文案全量改名为“保单检视”

  {key:'summary',           label:'综合摘要',         cls:''      },

// ==================== SDK 初始化 ====================
var authInst = null;
async function initSdk(){
  if(!CONFIG.envId){
    document.getElementById('view').innerHTML = '<div class="card"><p>请在 admin.html 中设置 <code>window.APP_CONFIG.envId</code> 为你的 CloudBase 环境 ID，然后部署到静态托管。</p><p>本页面通过 <code>app.callFunction</code> 调用云函数（同域），不直连 PG，不直连 AI。</p></div>';
    return false;
  }
  document.getElementById('env-label').textContent = 'env: ' + CONFIG.envId;
  app = cloudbase.init({ env: CONFIG.envId });
  authInst = app.auth({persistence:'local'});
  // 跨刷新/后台回收的超时检查：距上次活动超过 5 分钟则清除登录态，要求重新登录（iOS Safari 回收页面场景）
  try {
    var _stored = parseInt(localStorage.getItem('crm_last_activity')||'0',10);
    if(_stored && Date.now() - _stored > SESSION_TIMEOUT){
      try { if(authInst.signOut) authInst.signOut().catch(function(){}); } catch(e2){}
      await showLogin();
      return true;
    }
  } catch(e0){ console.warn(e0); }
  // 已有登录态（本地持久化）则直接进入
  try { if(authInst.hasLoginState && authInst.hasLoginState()) return true; } catch(e){ console.warn(e); }
  await showLogin();
  return true;
}

function showLogin(){
  return new Promise(function(resolve){
    var view = document.getElementById('view');
    view.innerHTML = '';
    var card = el('div', {class:'card'});
    card.appendChild(el('h2', {}, 'CRM 登录'));
    card.appendChild(el('p', {}, '请输入账号密码登录（云开发平台的注册用户）。'));
    var form = el('form');
    var u = el('input', {type:'text', name:'username', placeholder:'用户名', autocomplete:'username'});
    var p = el('input', {type:'password', name:'password', placeholder:'密码', autocomplete:'current-password'});
    var btn = el('button', {type:'submit', class:'btn'}, '登录');
    var msg = el('div', {});
    msg.style.color = '#c0392b'; msg.style.marginTop = '8px'; msg.style.fontSize = '13px';
    form.onsubmit = async function(ev){
      ev.preventDefault();
      if(!u.value.trim() || !p.value){ msg.textContent = '请输入用户名和密码'; return; }
      btn.disabled = true; btn.textContent = '登录中…'; msg.textContent = '';
      try {
        await authInst.signInWithPassword({ username: u.value.trim(), password: p.value });
        lastActivity = Date.now(); persistActivity(true);
        resolve();
      } catch(e){
        msg.textContent = '登录失败：' + (e.message || e);
        btn.disabled = false; btn.textContent = '登录';
      }
    };
    var fu = el('div', {class:'field'}, [el('label', {}, '用户名'), u]);
    var fp = el('div', {class:'field'}, [el('label', {}, '密码'), p]);
    form.appendChild(fu); form.appendChild(fp); form.appendChild(btn);
    card.appendChild(form); card.appendChild(msg);
    view.appendChild(card);
  });
}

// ==================== 会话超时（5 分钟无操作 → 下次操作要求重新登录） ====================
var SESSION_TIMEOUT = 5 * 60 * 1000;
var lastActivity = Date.now();
var sessionLocked = false;          // 过期锁定：锁定期间用户活动不再刷新计时，必须重新登录
var sessionWaiters = [];            // 等待重新登录完成的挂起操作
var reloginShowing = false;

// 活动时间戳持久化：iOS Safari 后台回收/刷新页面后仍能判断超时（iPhone/iPad/电脑通用）
function persistActivity(force){
  try {
    var now = Date.now();
    if(!force && now - (persistActivity.t||0) < 15000) return; // 节流：15 秒最多写一次
    persistActivity.t = now;
    localStorage.setItem('crm_last_activity', String(now));
  } catch(e){}
}
try { var _sa = parseInt(localStorage.getItem('crm_last_activity')||'0',10); if(_sa) lastActivity = _sa; } catch(e){}

// 用户主动操作（点击/键盘/触摸/滚动）视为活动；锁定状态下不刷新计时
['click','mousedown','keydown','touchstart','wheel'].forEach(function(ev){
  window.addEventListener(ev, function(){ if(!sessionLocked){ lastActivity = Date.now(); persistActivity(false); } }, true);
});

function ensureSession(){
  if(!sessionLocked && Date.now() - lastActivity <= SESSION_TIMEOUT){ lastActivity = Date.now(); persistActivity(true); return Promise.resolve(); }
  if(!sessionLocked){ sessionLocked = true; }
  return forceReLogin();
}

function forceReLogin(){
  return new Promise(function(resolve){
    sessionWaiters.push(resolve);
    if(reloginShowing) return;
    reloginShowing = true;
    // 清除本地登录态，重新登录只能使用云开发平台"用户管理"中的账号密码
    try { if(authInst && authInst.signOut) authInst.signOut().catch(function(){}); } catch(e){}
    showReLoginOverlay(function(){
      sessionLocked = false;
      lastActivity = Date.now();
      persistActivity(true);
      var ws = sessionWaiters; sessionWaiters = []; reloginShowing = false;
      ws.forEach(function(r){ try { r(); } catch(e){} });
      route(); // 刷新当前视图
    });
  });
}

function showReLoginOverlay(onOk){
  var overlay = el('div', {class:'modal-overlay relogin-overlay'});
  var m = el('div', {class:'modal', style:'max-width:400px'});
  m.appendChild(el('h3', {}, '会话已超时，请重新登录'));
  m.appendChild(el('p', {style:'font-size:13px;color:var(--muted);margin-bottom:14px'}, '系统超过 5 分钟无操作，为保障数据安全请使用云开发平台账号重新登录。'));
  var form = el('form');
  var u = el('input', {type:'text', name:'username', placeholder:'用户名', autocomplete:'username'});
  var p = el('input', {type:'password', name:'password', placeholder:'密码', autocomplete:'current-password'});
  var btn = el('button', {type:'submit', class:'btn btn-primary', style:'width:100%'}, '登录');
  var msg = el('div', {style:'color:#c0392b;margin-top:10px;font-size:13px'});
  form.onsubmit = async function(ev){
    ev.preventDefault();
    if(!u.value.trim() || !p.value){ msg.textContent = '请输入用户名和密码'; return; }
    btn.disabled = true; btn.textContent = '登录中…'; msg.textContent = '';
    try {
      await authInst.signInWithPassword({ username: u.value.trim(), password: p.value });
      overlay.remove();
      toast('已重新登录');
      onOk();
    } catch(e){
      msg.textContent = '登录失败：' + (e.message || e);
      btn.disabled = false; btn.textContent = '登录';
    }
  };
  form.appendChild(el('div', {class:'field'}, [el('label', {}, '用户名'), u]));
  form.appendChild(el('div', {class:'field'}, [el('label', {}, '密码'), p]));
  form.appendChild(btn);
  m.appendChild(form); m.appendChild(msg);
  overlay.appendChild(m);
  document.getElementById('modal-root').appendChild(overlay);
  setTimeout(function(){ u.focus(); }, 50);
}

// ==================== API 封装 ====================
async function callFn(name, data){
  await ensureSession(); // 超过 5 分钟无操作时，先要求重新登录再继续原操作
  var res = await app.callFunction({ name: name, data: data });
  return res.result;
}

// ==================== DOM 工具 ====================
function el(tag, attrs, children){
  var n = document.createElement(tag);
  if(attrs) for(var k in attrs){
    if(k==='class') n.className = attrs[k];
    else if(k==='html') n.innerHTML = attrs[k];
    else if(k==='disabled'){ if(attrs[k]) n.disabled = true; }
    else if(k.indexOf('on')===0 && typeof attrs[k]==='function') n[k] = attrs[k];
    else n.setAttribute(k, attrs[k]);
  }
  if(children){
    if(!Array.isArray(children)) children = [children];
    children.forEach(function(c){
      if(c==null) return;
      n.appendChild(typeof c==='string' ? document.createTextNode(c) : c);
    });
  }
  return n;
}
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function toast(msg, type){
  var t = el('div', {class:'toast '+(type||'ok')}, msg);
  document.getElementById('toast-root').appendChild(t);
  setTimeout(function(){ t.remove(); }, 2800);
}
function $(id){ return document.getElementById(id); }

// ==================== 表单生成 ====================
function makeField(f, value){
  var val = value==null ? '' : value;
  var input;
  if(f.type==='textarea'){
    input = el('textarea', {name:f.name});
    input.value = val;
  } else if(f.type==='select'){
    input = el('select', {name:f.name});
    (f.options||['']).forEach(function(o){
      var opt = el('option', {value:o}, o || '(空)');
      if(o===val) opt.selected = true;
      input.appendChild(opt);
    });
  } else {
    input = el('input', {type:f.type||'text', name:f.name});
    input.value = val;
  }
  return el('div', {class:'field'}, [el('label',{},f.label+(f.req?' *':'')), input]);
}

function collectForm(modal){
  var out = {};
  modal.querySelectorAll('[name]').forEach(function(inp){
    var v = inp.value.trim();
    out[inp.name] = v;
  });
  return out;
}

function modal(title, fields, values, onSubmit, opts){
  var overlay = el('div', {class:'modal-overlay'});
  var form = el('div', {class:'modal', style:(opts && opts.wide)?'max-width:760px':''});
  form.appendChild(el('h3', {}, title));
  var rows = el('div', {});
  fields.forEach(function(f, i){
    rows.appendChild(makeField(f, values ? values[f.name] : null));
    if(i%2===1 && i<fields.length-1){
      // 视觉分组：每两个字段后无特殊处理，CSS grid 处理
    }
  });
  form.appendChild(rows);
  if(opts && opts.nameDupCheck) attachNameDupCheck(form, opts.nameDupExcludeId);
  var footer = el('div', {class:'modal-footer'}, [
    el('button', {class:'btn', onclick:function(){ overlay.remove(); }}, '取消'),
    el('button', {class:'btn btn-primary', onclick:async function(){
      var btn = this; btn.disabled = true; btn.textContent = '提交中…';
      try { await onSubmit(collectForm(form)); overlay.remove(); }
      catch(e){ toast(e.message, 'err'); }
      finally { btn.disabled = false; btn.textContent = '确定'; }
    }}, '确定'),
  ]);
  form.appendChild(footer);
  overlay.appendChild(form);
  overlay.addEventListener('click', function(e){ if(e.target===overlay) overlay.remove(); });
  document.getElementById('modal-root').appendChild(overlay);
  return overlay;
}

// 客户姓名快速查重：失焦后立即搜索同名客户，即时提醒（改名或去编辑已有客户）
function attachNameDupCheck(container, excludeId){
  var input = container.querySelector('[name=customer_name]');
  if(!input) return;
  var tip = el('div', {class:'name-dup-tip'});
  input.parentNode.appendChild(tip);
  function clearTip(){ tip.style.display='none'; tip.innerHTML=''; input.style.borderColor=''; }
  async function check(){
    var name = input.value.trim();
    if(!name){ clearTip(); return; }
    try {
      var r = await callFn('customers', {action:'list', keyword:name, pageSize:100});
      var kw = name.toLowerCase();
      var dups = (r.rows||[]).filter(function(c){
        return (c.customer_name||'').trim().toLowerCase()===kw && String(c.Id)!==String(excludeId);
      });
      if(!dups.length){ clearTip(); return; }
      tip.innerHTML = '';
      tip.appendChild(el('div', {class:'name-dup-alert'}, '⚠ 已存在同名客户，建议修改姓名，或编辑已有客户：'));
      dups.slice(0,3).forEach(function(c){
        tip.appendChild(el('a', {class:'name-dup-link', onclick:function(){
          location.hash = '#/customer/'+c.Id;
        }}, '#'+c.Id+' '+c.customer_name+(c.customer_stage?('（'+c.customer_stage+'）'):'')+' — 点击查看/编辑'));
      });
      if(dups.length>3) tip.appendChild(el('div', {class:'name-dup-more'}, '…共 '+dups.length+' 个同名客户'));
      tip.style.display='block';
      input.style.borderColor='#e11d48';
    } catch(e){ /* 查询失败不打扰输入 */ }
  }
  input.addEventListener('blur', check);
  input.addEventListener('input', clearTip);
}

// ==================== 路由 ====================
function route(){
  var hash = location.hash || '#/';
  var m = hash.match(/^#\/customer\/(\d+)$/);
  if(m) return showDetail(parseInt(m[1],10));
  var rc = hash.match(/^#\/recruit\/(\d+)$/);
  if(rc) return showCandidateDetail(parseInt(rc[1],10));
  if(hash === '#/recruit') return showRecruit();
  if(hash === '#/ai-suggestions') return showAiSuggestions();
  if(hash === '#/customers') return showList();
  showDashboard();
}

// ==================== 今日工作台（首页） ====================
function dayStr(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function diffDaysTo(dateStr, todayStr){
  // 返回 dateStr 相对 todayStr 的天数差（正=未来，负=过去），入参 YYYY-MM-DD
  if(!dateStr) return null;
  var a = new Date(dateStr.slice(0,10)+'T00:00:00').getTime();
  var b = new Date(todayStr+'T00:00:00').getTime();
  return Math.round((a-b)/86400000);
}

// ==================== 工作台状态（工作台与客户列表共享） ====================
// 按当天日期计算每个客户的工作台状态：
// overdue 已逾期 / today 今天跟进 / month 未来30天到期 / stale 久未联系(超过30天) / normal 正常
function computeWbStatus(c, todayStr){
  var nd = c.next_followup_date ? String(c.next_followup_date).slice(0,10) : '';
  var lastDate = c.latest_followup_date ? String(c.latest_followup_date).slice(0,10)
    : (c.first_contact_date ? String(c.first_contact_date).slice(0,10)
    : (c.created_at ? String(c.created_at).slice(0,10) : ''));
  var ndDiff = nd ? diffDaysTo(nd, todayStr) : null;
  if(ndDiff !== null && ndDiff < 0){
    var d = -ndDiff;
    return {key:'overdue', days:d, label:'逾期 '+d+' 天', badge:'wb wb-overdue'};
  }
  if(ndDiff === 0) return {key:'today', days:0, label:'今天跟进', badge:'wb wb-today'};
  if(ndDiff !== null && ndDiff <= 30){
    return {key:'month', days:ndDiff, label:(ndDiff===1 ? '明天到期' : ndDiff+' 天后到期'), badge:'wb wb-month'};
  }
  // 30 天外或无跟进计划：检查久未联系（超过 30 天，孤儿单风险）
  if(lastDate){
    var idle = -diffDaysTo(lastDate, todayStr);
    if(idle >= 30) return {key:'stale', days:idle, label:idle+' 天未联系', badge:'wb wb-stale'};
  }
  if(ndDiff !== null) return {key:'normal', days:ndDiff, label:ndDiff+' 天后跟进', badge:'wb wb-normal'};
  return {key:'normal', days:0, label:'正常跟进', badge:'wb wb-normal'};
}
// 状态排序值：紧急度从高到低（逾期最久 > 今天跟进 > 30天内最近到期 > 久未联系最久 > 正常）
function wbSortVal(c){
  var s = c._wb, d = s.days || 0;
  if(s.key === 'overdue') return 100000 - d;
  if(s.key === 'today')   return 200000;
  if(s.key === 'month')   return 300000 + d;
  if(s.key === 'stale')   return 400000 - d;
  return 500000 + d;
}

// 客户列表缓存：工作台与全部客户列表共用；客户/跟进等数据变更后调用 invalidateCustomers()
var customersCache = null;
async function loadCustomers(force){
  if(customersCache && !force) return customersCache;
  var r = await callFn('customers', {action:'list', page:1, pageSize:1000});
  var todayStr = dayStr(new Date());
  var rows = (r.rows || []).map(function(c){
    c._wb = computeWbStatus(c, todayStr);
    return c;
  });
  customersCache = rows;
  return rows;
}
function invalidateCustomers(){ customersCache = null; }

// 客户端排序比较（口径与云函数一致，另支持工作台状态 wb_status）
function cmpCustomerRows(a, b, field, asc){
  var va, vb;
  if(field === 'wb_status'){ va = wbSortVal(a); vb = wbSortVal(b); }
  else { va = a[field]; vb = b[field]; }
  if(va == null && vb == null) return a.Id - b.Id;
  if(va == null) return 1;
  if(vb == null) return -1;
  if(typeof va === 'string') va = va.toLowerCase();
  if(typeof vb === 'string') vb = vb.toLowerCase();
  if(va < vb) return asc ? -1 : 1;
  if(va > vb) return asc ? 1 : -1;
  return a.Id - b.Id;
}

    ]));
  });

  // 分页（每页最多 50 行）
  var pager = el('div', {class:'pager'});

  pager.appendChild(el('span', {}, state.page+' / '+pages+'（共'+total+'）'));
  pager.appendChild(el('button', {class:'btn btn-sm', disabled:state.page>=pages, onclick:function(){ if(state.page<pages){ state.page++; rerender(); } }}, '下一页'));
  card.appendChild(pager);
}

  try {
    rows = await loadCustomers();
    card.innerHTML = '';

    var todayStr = dayStr(new Date());
    card.appendChild(el('h2', {}, [
      document.createTextNode('今日工作台'),
      el('span', {class:'dash-date'}, todayStr + ' 星期' + '日一二三四五六'[new Date().getDay()]),
    ]));

    // 分类统计
    var counts = {all:rows.length, today:0, overdue:0, month:0, stale:0};
    rows.forEach(function(c){
      if(counts[c._wb.key] != null) counts[c._wb.key]++;
    });

    // 统计卡：点击即筛选下方表格，再点一次取消筛选
    var statBar = el('div', {class:'stat-bar'});

    function statCard(label, value, key, cls){
      var active = dashState.filter === key;
      var item = el('div', {class:'stat-item clickable'+(cls?' '+cls:'')+(active?' stat-active':'')}, [
        el('div', {class:'label'}, label),
        el('div', {class:'value'}, String(value)),
      ]);
      // 各筛选页签的默认排序：未来30天到期 / 已逾期 默认按下次跟进日期从最近到最远（asc）；其余保持工作台状态排序
      var DASH_DEFAULT_SORT = {
        '':        {sortField:'wb_status',          sortDir:'asc'},
        'today':   {sortField:'wb_status',          sortDir:'asc'},
        'month':   {sortField:'next_followup_date', sortDir:'asc'},
        'overdue': {sortField:'next_followup_date', sortDir:'asc'},
        'stale':   {sortField:'wb_status',          sortDir:'asc'},
      };
      item.onclick = function(){
        dashState.filter = (dashState.filter === key ? '' : key);
        dashState.page = 1;
        var ds = DASH_DEFAULT_SORT[dashState.filter] || DASH_DEFAULT_SORT[''];
        dashState.sortField = ds.sortField;
        dashState.sortDir = ds.sortDir;
        renderStats();
        renderTable();
      };
      statBar.appendChild(item);
    }
    function renderStats(){
      statBar.innerHTML = '';
      statCard('今日待跟进', counts.today, 'today', '');
      statCard('未来30天到期', counts.month, 'month', '');
      statCard('已逾期', counts.overdue, 'overdue', counts.overdue ? 'stat-danger' : '');
      statCard('久未联系(30天+)', counts.stale, 'stale', counts.stale ? 'stat-warn' : '');
      statCard('客户总数', counts.all, '', '');
    }
    renderStats();

    // 下方客户表格（与客户列表完全一致，随统计卡筛选 + 搜索联动）
    card.appendChild(tableCard);
    renderTable();
  } catch(e){
    card.innerHTML = '';
    card.appendChild(el('div', {class:'empty'}, '加载失败：' + esc(e.message)));
  }
}

var listState = { page:1, pageSize:LIST_PAGE_SIZE, keyword:'', sortField:'Id', sortDir:'desc' };

function makeSortHeader(field, label, state, rerender){
  var st = state || listState;
  var rd = rerender || showList;
  var th = el('th', {});
  th.style.cursor = 'pointer';
  th.style.whiteSpace = 'nowrap';
  var isCurrent = st.sortField === field;
  var arrow = isCurrent ? (st.sortDir === 'asc' ? ' ▲' : ' ▼') : '';
  th.onclick = function(){
    if(st.sortField === field){
      st.sortDir = st.sortDir === 'asc' ? 'desc' : 'asc';
    } else {
      st.sortField = field;
      st.sortDir = 'asc';
    }
    st.page = 1;
    rd();
  };
  th.appendChild(document.createTextNode(label + arrow));
  return th;
}

function renderPolicyReview(cid, rows, reports){
  var box = el('div', {});
  var existing = rows[0] || null;

  // 读取已保存的二维明细 items JSON；旧数据（只有扁平 ap_* 保额）自动兼容回填
  var itemMap = {};
  if(existing && existing.items){
    try {
      var arr = JSON.parse(existing.items);
      (arr || []).forEach(function(it){ if(it && it.key) itemMap[it.key] = it; });
    } catch(e){ itemMap = {}; }
  }

  // 为每个类别+字段构建：浏览态 span + 编辑态 input（始终都在 DOM；通过 CSS class 切换显隐）
  var inputs = {};
  var values = {};
  PRODUCT_CATEGORIES.forEach(function(cat){
    inputs[cat.key] = {}; values[cat.key] = {};
    var old = itemMap[cat.key] || {};
    PRODUCT_ITEM_FIELDS.forEach(function(f){
      var v;
      if(old[f.name] != null && old[f.name] !== '') v = old[f.name];
      else if(f.name === 'amount' && existing && existing[cat.key] != null) v = existing[cat.key]; // 旧扁平保额回填
      else v = '';
      values[cat.key][f.name] = v;
      var inp = el('input', {type:f.type, name:cat.key+'_'+f.name, placeholder:f.type === 'date' ? '' : '0'});
      if(v !== '' && v != null) inp.value = v;
      inputs[cat.key][f.name] = inp;
    });
  });

  // 辅助：金额千分位 / 日期 YYYY-MM-DD / 空 '—'
  function fmtCell(f, v){
    if(v == null || v === '') return el('span', {class:'empty-cell'}, '—');
    var s = String(v);
    if(f.type === 'number' && s){
      try {
        var n = Number(s);
        if(!isNaN(n) && isFinite(n)){
          if(Math.abs(n) >= 1000){
            s = n.toLocaleString('zh-CN', {maximumFractionDigits: 0});
          } else {
            s = String(n);
          }
        }
      } catch(e){}
    } else if(f.type === 'date' && s){
      s = String(s).slice(0, 10);
    }
    return el('span', {}, s);
  }

  // 表格：默认浏览态（view-only）
  var table = el('table', {class:'prod-table view-only'});
  var thead = el('thead');
  var htr = el('tr');
  htr.appendChild(el('th', {}, '保险类别'));
  PRODUCT_ITEM_FIELDS.forEach(function(f){ htr.appendChild(el('th', {}, f.label)); });
  thead.appendChild(htr);
  table.appendChild(thead);
  var tbody = el('tbody');
  PRODUCT_CATEGORIES.forEach(function(cat){
    var tr = el('tr');
    tr.appendChild(el('td', {class:'prod-cat'}, cat.label));
    PRODUCT_ITEM_FIELDS.forEach(function(f){
      var v = values[cat.key][f.name];
      var empty = v == null || v === '';
      var td = el('td', {class:'prod-val'+(empty?' empty':'')}, [
        fmtCell(f, v),
        inputs[cat.key][f.name], // 编辑态显隐由 .view-only/.editing CSS 控制
      ]);
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  box.appendChild(table);

  // 按钮行：浏览态显示「更新」+「生成报告」；编辑态显示「保存」+「取消」
  var actionRow = el('div', {class:'pol-action-row'});

  var btnUpdate = el('button', {class:'btn btn-primary btn-sm'}, '更新');
  var btnReport = el('button', {class:'btn btn-sm', style:'background:#10b981;color:#fff'}, '生成报告');
  var btnSave   = el('button', {class:'btn btn-primary btn-sm'}, '保存');
  var btnCancel = el('button', {class:'btn btn-sm'}, '取消');
  btnSave.style.display = 'none'; btnCancel.style.display = 'none';
  actionRow.appendChild(btnUpdate); actionRow.appendChild(btnReport);
  actionRow.appendChild(btnSave);   actionRow.appendChild(btnCancel);
  box.appendChild(actionRow);

  function enterEdit(){
    table.classList.remove('view-only'); table.classList.add('editing');
    btnUpdate.style.display = 'none'; btnReport.style.display = 'none';
    btnSave.style.display = '';       btnCancel.style.display = '';
  }
  function leaveEdit(){
    table.classList.add('view-only'); table.classList.remove('editing');
    btnUpdate.style.display = '';     btnReport.style.display = '';
    btnSave.style.display = 'none';   btnCancel.style.display = 'none';
  }

  btnUpdate.onclick = enterEdit;
  btnCancel.onclick = function(){ leaveEdit(); }; // 丢弃：直接重渲染浏览态
  btnSave.onclick = async function(){
    btnSave.disabled = true; btnSave.textContent = '保存中…';
    try {
      var items = PRODUCT_CATEGORIES.map(function(cat){
        var it = {key:cat.key, label:cat.label};
        PRODUCT_ITEM_FIELDS.forEach(function(f){ it[f.name] = inputs[cat.key][f.name].value; });
        return it;
      });
      var data = {customer_id:cid, items: JSON.stringify(items)};
      // 同步扁平保额列 ap_*（含 ap_ppa），供 AI 建议/保单检视报告生成逻辑继续使用
      PRODUCT_CATEGORIES.forEach(function(cat){ data[cat.key] = inputs[cat.key].amount.value; });
      await callFn('products', {action:'upsert', data:data});
      toast('保单检视已保存');
      showDetail(cid);
    } catch(e){ toast(e.message, 'err'); }
    finally { btnSave.disabled=false; btnSave.textContent='保存'; }
  };

  btnReport.onclick = async function(){
    btnReport.disabled = true; btnReport.textContent = '生成中（约 1-2 分钟）…';
    try {
      var r = await callFn('policy_review_reports', {
        action:'generate', customer_id:cid, operator: CONFIG.operator || null,
      });
      if(r && r.error){ toast(r.error, 'err'); return; }
      toast('保单检视报告已生成');
      showDetail(cid);
    } catch(e){ toast(e.message, 'err'); }
    finally { btnReport.disabled=false; btnReport.textContent='生成报告'; }
  };

  // -------------- 保单检视报告列表（表格下方，时间倒序） --------------
  var prrSec = el('section', {class:'prr-section'});
  var prrH = el('h3', {}, [
    el('span', {}, '保单检视报告'),
    el('span', {style:'font-size:12px;color:var(--muted);font-weight:400;margin-left:8px'}, reports && reports.length ? ('共 '+reports.length+' 份，最新在前') : '还没有检视报告'),
  ]);
  prrSec.appendChild(prrH);

  if(!reports || !reports.length){
    prrSec.appendChild(el('div', {class:'empty'}, '暂无保单检视报告，点击上方「生成报告」即可基于客户的保单配置与沟通信息生成一份家庭保单检视报告。'));
  } else {
    reports.forEach(function(rpt){
      prrSec.appendChild(buildPolicyReviewCard(cid, rpt));
    });
  }
  box.appendChild(prrSec);

  return box;
}

// 构建单张保单检视报告卡片（浏览态 + 可切编辑态）
// 显示优先级：edited_* 非空优先，否则原始生成字段（与后端 policy_review_reports 的 disp() 一致）
function buildPolicyReviewCard(cid, rpt){
  var card = el('div', {class:'prr-card'});
  var editing = false;

  function disp(field){
    var e = rpt['edited_' + field];
    if(e != null && e !== '') return e;
    var v = rpt[field];
    return (v != null && v !== '') ? v : '';
  }

  // 顶部：日期徽标 + 类型 + 编辑/删除按钮
  var headRow = el('div', {class:'prr-head'}, [
    el('div', {class:'badges'}, [
      el('span', {class:'badge stage'}, '报告日期：' + String(rpt.report_date||'').slice(0,10)),
      el('span', {class:'badge'}, rpt.report_type || '保单年度检视'),
    ]),
    el('div', {class:'actions'}, [
      el('button', {class:'btn btn-sm'}, '编辑'),
      el('button', {class:'btn btn-sm', style:'background:#ef4444;color:#fff'}, '删除'),
    ]),
  ]);
  card.appendChild(headRow);
  var btnEdit   = headRow.querySelector('.actions button:nth-child(1)');
  var btnDelete = headRow.querySelector('.actions button:nth-child(2)');

  // 5 个内容块（编辑态同时渲染 textarea；编辑态切换时通过 class 控制显隐）
  var textareas = {};
  PRR_BLOCKS.forEach(function(b){
    var block = el('div', {class:'prr-block ' + b.cls}, [
      el('h4', {}, b.label),
      el('div', {class:'prr-body'}, disp(b.key) || el('span', {style:'color:var(--muted);font-style:italic'}, '（空）')),
    ]);
    var ta = el('textarea', {name:'prr_'+b.key, placeholder:'（编辑：' + b.label + '）'}, disp(b.key));
    block.appendChild(ta);
    textareas[b.key] = ta;
    card.appendChild(block);
  });

  // 编辑态底部「保存 / 取消」按钮行（默认隐藏）
  var editRow = el('div', {class:'prr-editrow', style:'display:none'}, [
    el('button', {class:'btn btn-sm'}, '取消'),
    el('button', {class:'btn btn-primary btn-sm'}, '保存修改'),
  ]);
  card.appendChild(editRow);
  var btnCancelEdit = editRow.querySelector('button:nth-child(1)');
  var btnSaveEdit   = editRow.querySelector('button:nth-child(2)');

  function setEdit(on){
    editing = on;
    if(on){ card.classList.add('prr-editing'); }
    else  { card.classList.remove('prr-editing'); }
    btnEdit.style.display   = on ? 'none' : '';
    btnDelete.style.display = on ? 'none' : '';
    editRow.style.display   = on ? '' : 'none';
  }

  btnEdit.onclick = function(){ setEdit(true); };

  btnCancelEdit.onclick = function(){
    // 取消：把当前 rpt 当前值回写 textarea（防止用户误操作后保留脏值）
    PRR_BLOCKS.forEach(function(b){ textareas[b.key].value = disp(b.key); });
    setEdit(false);
  };

  btnSaveEdit.onclick = async function(){
    btnSaveEdit.disabled = true; btnSaveEdit.textContent = '保存中…';
    try {
      var payload = {};
      PRR_BLOCKS.forEach(function(b){
        var k = 'edited_' + b.key;
        payload[k] = textareas[b.key].value;
      });
      var res = await callFn('policy_review_reports', { action:'update', id:rpt.id, data:payload });
      if(res && res.error){ toast(res.error, 'err'); return; }
      // 同步到 rpt（当前卡片数据源）；然后刷新整页，重新从服务端拉取确保一致
      toast('保单检视报告已更新');
      showDetail(cid);
    } catch(e){ toast(e.message, 'err'); }
    finally { btnSaveEdit.disabled=false; btnSaveEdit.textContent='保存修改'; }
  };

  btnDelete.onclick = function(){
    if(!confirm('确定要删除这份保单检视报告？删除后无法恢复。')) return;
    (async function(){
      btnDelete.disabled = true;
      try {
        var res = await callFn('policy_review_reports', { action:'remove', id:rpt.id });
        if(res && res.error){ toast(res.error,'err'); return; }
        toast('已删除');
        showDetail(cid);
      } catch(e){ toast(e.message,'err'); }
      finally { btnDelete.disabled=false; }
    })();
  };

  return card;
}

// ---------- 伴手礼 ----------
function renderGifts(cid, rows){
  var box = el('div', {});
  box.appendChild(el('div', {style:'margin-bottom:12px'}, el('button', {class:'btn btn-primary btn-sm', onclick:function(){ openGiftForm(cid, null); }}, '+ 新增礼品')));
  if(!rows.length){ box.appendChild(el('div',{class:'empty'},'暂无礼品')); return box; }
  rows.forEach(function(g){
    var card = el('div', {class:'card', style:'margin-bottom:8px;padding:10px'});
    card.appendChild(el('div', {style:'display:flex;justify-content:space-between'}, [
      el('strong', {}, g.gift_name + (g.quantity?' ×'+g.quantity:'')),
      el('div', {}, [
        el('a', {class:'btn-sm', style:'margin-right:8px', onclick:function(){ openGiftForm(cid, g); }}, '编辑'),
        el('a', {class:'btn-sm btn-danger', onclick:async function(){
          if(!confirm('删除该礼品？')) return;
          await callFn('gifts', {action:'remove', id:g.Id});
          toast('已删除'); showDetail(cid);
        }}, '删除'),
      ]),
    ]));
    if(g.given_date) card.appendChild(el('span', {style:'color:var(--muted);font-size:13px'}, '赠送日期：'+String(g.given_date).slice(0,10)));
    if(g.notes) card.appendChild(el('p', {}, g.notes));
    box.appendChild(card);
  });
  return box;
}

function openGiftForm(cid, gift){
  var FIELDS = [
    {name:'gift_name',label:'礼品名称',type:'text',req:true},
    {name:'quantity',label:'数量',type:'number'},
    {name:'given_date',label:'赠送日期',type:'date'},
    {name:'notes',label:'备注',type:'textarea'},
  ];
  modal(gift?'编辑礼品':'新增礼品', FIELDS, gift, async function(data){
    data.customer_id = cid;
    if(gift){
      await callFn('gifts', {action:'update', id:gift.Id, data:data});
      toast('已保存');
    } else {
      await callFn('gifts', {action:'create', data:data});
      toast('已添加');
    }
    showDetail(cid);
  });
}

// ---------- 照片/附件（共用 photos 表，category 区分） ----------
var photoFilter = 'all'; // 'all' | 'photo' | 'attachment'

function isPhotoRow(p){ return (p.category || 'photo') === 'photo'; }

function renderPhotos(cid, rows){
  var box = el('div', {});
  // 上传区（支持多文件：图片→照片，其他→附件）
  var notesInput = el('input', {type:'text', placeholder:'描述（可选，应用到本次上传的全部文件）', style:'width:100%;padding:6px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px'});
  var fileInput = el('input', {type:'file', multiple:true, style:'display:none', onchange:async function(e){
    var files = Array.prototype.slice.call(e.target.files||[]); if(!files.length) return;
    for(var i=0;i<files.length;i++){
      if(files[i].size > 4*1024*1024){ toast('“'+files[i].name+'”过大（>4MB）','err'); return; }
    }
    var desc = notesInput.value.trim();
    var btn = uploadBtn; btn.disabled=true; btn.textContent='上传中…';
    var ok=0, fail=0;
    try {
      for(var i=0;i<files.length;i++){
        try {
          var b = await fileToBase64(files[i]);
          var kind = /^image\//.test(files[i].type) ? 'photo' : 'attachment';
          await callFn('photos', {action:'create', data:{customer_id:cid, image_base64:b.base64, content_type:b.contentType, file_name:b.fileName, category:kind, photo_notes:desc || null}});
          ok++;
        } catch(err){ fail++; }
      }
      if(ok) toast('已上传 '+ok+' 个文件');
      if(fail) toast(fail+' 个文件上传失败','err');
      notesInput.value='';
      showDetail(cid);
    } finally { btn.disabled=false; btn.textContent='+ 上传照片/附件'; e.target.value=''; }
  }});
  var uploadBtn = el('button', {class:'btn btn-primary btn-sm', onclick:function(){ fileInput.click(); }}, '+ 上传照片/附件');
  var uploadWrap = el('div', {class:'photo-upload'}, [
    uploadBtn, fileInput,
    notesInput
  ]);
  box.appendChild(uploadWrap);

  // 过滤：全部 / 照片 / 附件
  function chip(label, val){
    return el('button', {class:'btn btn-sm'+(photoFilter===val?' btn-primary':''), onclick:function(){ photoFilter=val; showDetail(cid); }}, label);
  }
  box.appendChild(el('div', {class:'photo-filter'}, [chip('全部','all'), chip('照片','photo'), chip('附件','attachment')]));

  var filtered = rows.filter(function(p){
    if(photoFilter==='photo') return isPhotoRow(p);
    if(photoFilter==='attachment') return !isPhotoRow(p);
    return true;
  });
  if(!filtered.length){
    var emptyText = photoFilter==='photo' ? '暂无照片' : (photoFilter==='attachment' ? '暂无附件' : '暂无照片或附件');
    box.appendChild(el('div',{class:'empty'}, emptyText));
    return box;
  }
  var grid = el('div', {class:'photo-grid'});
  filtered.forEach(function(p){
    grid.appendChild(renderPhotoItem(cid, p));
  });
  box.appendChild(grid);
  return box;
}

function renderPhotoItem(cid, p){
  var item = el('div', {class:'photo-item'});
  var isImg = isPhotoRow(p) && (!p.content_type || /^image\//.test(p.content_type));
  var notesEl = el('div', {class:'photo-notes'});
  var notesText = p.photo_notes ? p.photo_notes : '';
  if(isImg){
    var loadingEl = el('div', {class:'loading', style:'font-size:12px;height:140px;display:flex;align-items:center;justify-content:center'}, '加载…');
    item.appendChild(loadingEl);
    (async function(){
      try {
        var r = await callFn('photos', {action:'get', id:p.id});
        if(r.photo && r.photo.photo_url){
          var url = r.photo.photo_url;
          if(loadingEl.parentNode) loadingEl.remove();
          var img = el('img', {src:url, alt:p.file_name||'照片', title:'点击查看原图'});
          img.onclick = function(){ showImagePreview(url, p.file_name, notesText); };
          item.insertBefore(img, item.firstChild);
        } else {
          loadingEl.textContent = '无图';
        }
      } catch(e){ loadingEl.textContent = '加载失败'; }
    })();
  } else {
    // 附件卡片：扩展名徽标 + 文件名
    var ext = ((p.file_name||'').split('.').pop() || 'FILE').toUpperCase().slice(0,5);
    item.appendChild(el('div', {class:'attach-box'}, [
      el('div', {class:'attach-ext'}, ext),
      el('div', {class:'attach-name', title:p.file_name||''}, p.file_name||'附件'),
    ]));
  }
  if(notesText){
    notesEl.appendChild(el('div', {class:'photo-notes-text'}, notesText));
  } else {
    notesEl.appendChild(el('div', {class:'photo-notes-empty'}, '点击添加描述'));
  }
  var actions = el('div', {class:'photo-notes-actions'});
  if(!isImg){
    actions.appendChild(el('button', {class:'btn btn-ghost', onclick:async function(){
      try {
        var r = await callFn('photos', {action:'get', id:p.id});
        var url = r.photo && r.photo.photo_url;
        if(!url){ toast('未取到文件','err'); return; }
        var a = document.createElement('a');
        a.href = url; a.download = p.file_name || 'attachment';
        document.body.appendChild(a); a.click(); a.remove();
      } catch(e){ toast(e.message,'err'); }
    }}, '下载'));
  }
  actions.appendChild(el('button', {class:'btn btn-ghost', onclick:function(){ openPhotoNotesModal(cid, p.id, notesText); }}, '编辑描述'));
  actions.appendChild(el('button', {class:'btn btn-danger btn-sm', onclick:async function(){
    if(!confirm(isImg?'删除该照片？':'删除该附件？')) return;
    try { await callFn('photos', {action:'remove', id:p.id}); toast('已删除'); showDetail(cid); }
    catch(e){ toast(e.message,'err'); }
  }}, '删除'));
  notesEl.appendChild(actions);
  item.appendChild(notesEl);
  return item;
}

// ---------- OCR 记录（AI 解析识别结果，关联 photos 文件） ----------
function parseJsonArr(s){
  try { var v = JSON.parse(s || '[]'); return Array.isArray(v) ? v : []; } catch(e){ return []; }
}
function fmtOcrTime(s){
  if(!s) return '';
  var d = new Date(s);
  if(isNaN(d.getTime())) return String(s).replace('T',' ').slice(0,16);
  function p(n){ return (n<10?'0':'')+n; }
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());
}

async function renderOcrRecords(cid){
  var box = el('div', {});
  var loading = el('div', {class:'loading'}, '加载中…');
  box.appendChild(loading);
  var rows;
  try {
    var r = await callFn('ocr_records', {action:'list', customer_id:cid});
    rows = r.rows || [];
  } catch(e){ loading.textContent = '加载失败：'+esc(e.message); return box; }
  loading.remove();
  if(!rows.length){
    box.appendChild(el('div', {class:'empty'}, '暂无 AI 解析记录。使用首页"AI 解析客户资料"上传照片/文件后，解析汇总与识别内容会自动保存到这里。'));
    return box;
  }
  // 关联文件映射（照片/附件元数据来自客户详情已加载的数据）
  var photosMap = {};
  ((detailState.data && detailState.data.photos) || []).forEach(function(p){ photosMap[String(p.id)] = p; });
  rows.forEach(function(rec){
    box.appendChild(renderOcrItem(cid, rec, photosMap));
  });
  return box;
}

function renderOcrItem(cid, rec, photosMap){
  var card = el('div', {class:'card ocr-item'});
  // 头部：时间 + 操作
  var fileIds = parseJsonArr(rec.file_ids);
  var fileNames = parseJsonArr(rec.file_names);
  var hasFiles = fileIds.length > 0;
  var actions = el('div', {class:'ocr-actions'});
  actions.appendChild(el('button', {class:'btn btn-ghost', onclick:function(){ openOcrEditModal(cid, rec); }}, '编辑'));
  var delBtn = el('button', {class:'btn btn-sm', style:'background:#ef4444;color:#fff'}, '删除');
  delBtn.onclick = function(){
    if(!confirm('确定要删除这条 AI 解析记录？')) return;
    (async function(){
      delBtn.disabled = true;
      try {
        var r = await callFn('ocr_records', {action:'remove', id:rec.id});
        if(r && r.error){ toast(r.error,'err'); return; }
        // 如果存在客户信息快照，询问是否恢复
        var snap = r.customer_snapshot;
        if(snap){
          try { snap = JSON.parse(snap); } catch(e){ snap = null; }
        }
        if(snap){
          if(confirm('已删除解析记录。\n\n本次解析时保存了客户信息快照（解析前的版本）。\n\n是否将客户信息恢复到解析前的版本？\n（取消则保持当前客户信息不变）')){
            var restoreData = {};
            CUSTOMER_FIELDS.forEach(function(f){ if(snap[f.name] != null) restoreData[f.name] = snap[f.name]; });
            await callFn('customers', {action:'update', id:cid, data:restoreData});
            toast('客户信息已恢复到解析前版本');
            invalidateCustomers();
          } else {
            toast('已删除解析记录，客户信息保持不变');
          }
        } else {
          toast('已删除解析记录');
        }
        showDetail(cid);
      } catch(e){ toast(e.message,'err'); }
      finally { delBtn.disabled=false; }
    })();
  };
  actions.appendChild(delBtn);
  var updBtn = el('button', {class:'btn btn-primary btn-sm', onclick:function(){ updateCustomerFromOcr(cid, rec, updBtn); }}, '更新客户信息');
  actions.appendChild(updBtn);
  card.appendChild(el('div', {class:'ocr-head'}, [
    el('span', {class:'ocr-time'}, fmtOcrTime(rec.created_at) + (rec.updated_at ? '（已修订）' : '')),
    actions,
  ]));
  // 摘要（附加信息提炼结果）
  var summaryText = rec.summary || '';
  if(summaryText){
    card.appendChild(el('div', {class:'ocr-block'}, [
      el('div', {class:'ocr-block-label'}, '解析汇总（追加到附加信息）'),
      el('div', {class:'ocr-summary'}, summaryText),
    ]));
  }
  // 识别原文（默认折叠）
  if(rec.raw_text){
    card.appendChild(el('details', {class:'ocr-raw'}, [
      el('summary', {}, '识别原文'),
      el('div', {class:'ocr-raw-text'}, rec.raw_text),
    ]));
  }
  // 关联文件（点击查看图片 / 下载附件）
  if(hasFiles){
    var filesRow = el('div', {class:'ocr-files'});
    filesRow.appendChild(el('div', {class:'ocr-block-label'}, '关联文件（'+fileIds.length+'）'));
    var chips = el('div', {class:'ocr-file-chips'});
    fileIds.forEach(function(fid, i){
      var p = photosMap[String(fid)];
      var name = (p && p.file_name) || fileNames[i] || ('文件#'+fid);
      var isGone = !p;
      var chip = el('button', {class:'ocr-file-chip'+(isGone?' gone':''), title:isGone?'文件已不存在或已删除':'点击查看'},
        (isGone ? '⚠ ' : (/^image\//.test((p && p.content_type) || '') ? '🖼 ' : '📄 ')) + name);
      if(!isGone){
        chip.onclick = async function(){
          try {
            var r = await callFn('photos', {action:'get', id:p.id});
            var url = r.photo && r.photo.photo_url;
            if(!url){ toast('未取到文件','err'); return; }
            if(/^image\//.test(p.content_type || '')) showImagePreview(url, p.file_name, p.photo_notes);
            else {
              var a = document.createElement('a');
              a.href = url; a.download = p.file_name || 'attachment';
              document.body.appendChild(a); a.click(); a.remove();
            }
          } catch(e){ toast(e.message,'err'); }
        };
      }
      chips.appendChild(chip);
    });
    filesRow.appendChild(chips);
    card.appendChild(filesRow);
  }
  return card;
}

// 基于 OCR 记录重新 AI 匹配 → 复用对比审核界面，人工确认后更新客户信息
async function updateCustomerFromOcr(cid, rec, btn){
  var oldLabel = btn.textContent;
  btn.disabled = true; btn.textContent = 'AI 匹配中…';
  try {
    var text = '';
    if(rec.summary) text += '【解析汇总】\n' + rec.summary + '\n\n';
    if(rec.raw_text) text += '【识别原文】\n' + rec.raw_text;
    if(!text.trim()){ toast('该记录无内容可解析','err'); return; }
    var r = await callFn('ai_parse', { text: text });
    if(r.error){ toast(r.error,'err'); return; }
    var parsed = r.parsed || {};
    if(Object.prototype.hasOwnProperty.call(parsed,'ocr_text')) delete parsed.ocr_text;
    if(Array.isArray(parsed.additional_info)) parsed.additional_info = parsed.additional_info.join('\n');
    // 以当前客户为唯一匹配对象，复用同名对比更新界面（无文件保存）
    var cur = detailState.data && detailState.data.customer;
    if(!cur){ toast('客户数据未加载','err'); return; }
    openMergeCompareModal(parsed, [cur], null, 0, null);
  } catch(e){ toast(e.message,'err'); }
  finally { btn.disabled = false; btn.textContent = oldLabel; }
}

function fileToBase64(file){
  return new Promise(function(resolve, reject){
    var reader = new FileReader();
    reader.onload = function(){
      var dataUrl = reader.result;
      var parts = dataUrl.split(',');
      var base64 = parts[1] || '';
      var ct = (dataUrl.match(/^data:(.*?);/) || [,'image/jpeg'])[1];
      resolve({ base64:base64, contentType:ct, fileName:file.name });
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

          // 同步到当前 rec 对象，再重读整页刷新

          rec.suggested_strategy = payload.suggested_strategy;
          rec.suggested_followup_date = payload.suggested_followup_date;
          rec.suggested_customer_stage = payload.suggested_customer_stage;

          showDetail(cid);

        finally { btnSaveAi.disabled=false; btnSaveAi.textContent='保存修改'; }
      };

      renderView();
      box.appendChild(card);
    });
  } else {
    box.appendChild(el('div', {class:'empty'}, '暂无 AI 建议，点击上方按钮生成'));
  }
  return box;
}

// ---- 浏览器本地文字提取（免费方案：Tesseract.js OCR 识别图片 + pdf.js 提取 PDF 文字）----
var _loadedScripts = {};
function loadScript(src){
  if(!_loadedScripts[src]){
    _loadedScripts[src] = new Promise(function(res, rej){
      var s = document.createElement('script');
      s.src = src;
      s.onload = function(){ res(); };
      s.onerror = function(){ _loadedScripts[src] = null; rej(new Error('识别组件加载失败，请检查网络后重试')); };
      document.head.appendChild(s);
    });
  }
  return _loadedScripts[src];
}
var _ocrWorker = null, _ocrProgCb = null;
async function ocrImageByTesseract(file, onProg){
  await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js');
  if(typeof Tesseract === 'undefined') throw new Error('OCR 组件加载失败');
  if(!_ocrWorker){
    _ocrWorker = await Tesseract.createWorker('chi_sim+eng', 1, {
      logger: function(msg){ if(_ocrProgCb && msg.status === 'recognizing text') _ocrProgCb(msg.progress || 0); }
    });
  }
  _ocrProgCb = onProg || null;
  try {
    var ret = await _ocrWorker.recognize(file);
    return (ret && ret.data && ret.data.text) || '';
  } finally { _ocrProgCb = null; }
}
async function extractPdfText(file){
  await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');
  if(!window.pdfjsLib) throw new Error('PDF 组件加载失败');
  window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  var buf = await file.arrayBuffer();
  var pdf = await window.pdfjsLib.getDocument({data: buf}).promise;
  var parts = [];
  for(var i=1;i<=pdf.numPages;i++){
    var page = await pdf.getPage(i);
    var content = await page.getTextContent();
    parts.push(content.items.map(function(it){ return it.str; }).join(' '));
  }
  return parts.join('\n');
}

  m.appendChild(el('h3', {}, 'AI 解析客户资料'));

    el('label', {}, '粘贴文本（姓名/电话/职业/生日/婚况等，可与文件/照片一起提供）'),
    el('textarea', {name:'text', style:'min-height:180px', placeholder:'例：王五，男，1990年6月15日生，教师，未婚，电话13900000000，喜欢钓鱼'})
  ]));
  var fileListEl = el('div', {class:'parse-file-list'});
  var progressEl = el('div', {class:'parse-progress', style:'display:none'});
  m.appendChild(el('div', {class:'field'}, [
    el('label', {}, '选择文件/照片（可多选）：照片与 PDF 将在本地识别/提取其中文字后交给 AI 解析；.txt/.md/.csv 等文本文件内容直接提供给 AI；其他类型文件（Word/Excel 等）保存为该客户的附件，仅文件名提供给 AI 参考'),
    el('input', {type:'file', name:'files', multiple:true, onchange:function(e){
      fileListEl.innerHTML = '';
      Array.prototype.slice.call(e.target.files||[]).forEach(function(f){
        fileListEl.appendChild(el('div', {}, f.name + '（' + (f.size/1024).toFixed(0) + ' KB）'));
      });
    }}),
    fileListEl,
  ]));
  m.appendChild(progressEl);
  m.appendChild(el('div', {class:'modal-footer'}, [
    el('button', {class:'btn', onclick:function(){ overlay.remove(); }}, '取消'),
    el('button', {class:'btn btn-primary', onclick:async function(){
      var btn=this; btn.disabled=true;
      var ta = m.querySelector('[name=text]');
      var text = ta.value.trim();
      var fileInput = m.querySelector('[name=files]');
      var files = Array.prototype.slice.call(fileInput.files || []);
      if(!text && !files.length){ toast('请输入文本或选择文件/照片','err'); btn.disabled=false; return; }
      function setProg(s){ progressEl.style.display='block'; progressEl.textContent=s; }
      // 分类：图片 / PDF / 文本文件 / 其他附件
      var imgFiles=[], pdfFiles=[], txtFiles=[], attachFiles=[];
      for(var i=0;i<files.length;i++){
        var f = files[i];
        if(f.size > 4*1024*1024){ toast('“'+f.name+'”过大（>4MB），请压缩后上传','err'); btn.disabled=false; return; }
        if(/^image\//.test(f.type)) imgFiles.push(f);
        else if(/\.pdf$/i.test(f.name) || f.type==='application/pdf') pdfFiles.push(f);
        else if(/^text\//.test(f.type) || /\.(txt|md|csv|json|log)$/i.test(f.name)) txtFiles.push(f);
        else attachFiles.push(f);
      }
      try {
        // 第一步：浏览器本地提取各文件中的文字（OCR 图片 / PDF 提取 / 文本直读）
        var extracted = [];
        var ocrItems = [];
        imgFiles.forEach(function(f){ ocrItems.push({file:f, kind:'img'}); });
        pdfFiles.forEach(function(f){ ocrItems.push({file:f, kind:'pdf'}); });
        var total = ocrItems.length + txtFiles.length;
        var done = 0;
        for(var i=0;i<ocrItems.length;i++){
          var it = ocrItems[i];
          var kindLabel = it.kind==='img' ? '照片文字识别中' : 'PDF 文字提取中';
          setProg('（'+(done+1)+'/'+total+'）'+kindLabel+'：'+it.file.name+(it.kind==='img'&&done===0?'（首次使用需下载识别引擎，请稍候）':''));
          var t = '';
          if(it.kind==='img'){
            t = await ocrImageByTesseract(it.file, function(p){ setProg('（'+(done+1)+'/'+total+'）照片文字识别中：'+it.file.name+' '+Math.round((p||0)*100)+'%'); });
          } else {
            t = await extractPdfText(it.file);
          }
          done++;
          t = String(t||'').trim();
          if(t) extracted.push('【' + (it.kind==='img'?'照片':'PDF') + ' ' + it.file.name + ' 识别文字】\n' + t);
        }
        for(var i=0;i<txtFiles.length;i++){
          setProg('（'+(done+1)+'/'+total+'）读取文本文件：'+txtFiles[i].name);
          var t = await txtFiles[i].text();
          done++;
          extracted.push('【附件 ' + txtFiles[i].name + ' 内容】\n' + String(t||'').slice(0, 10000));
        }
        // 第二步：全部文字统一交给 AI 解析
        var textCtx = text;
        extracted.forEach(function(t){ textCtx += '\n' + t; });
        for(var i=0;i<attachFiles.length;i++){
          textCtx += '\n【附件】' + attachFiles[i].name + '（已保存为客户附件，未读取内容）';
        }
        if(textCtx.length > 30000) textCtx = textCtx.slice(0, 30000) + '\n（内容过长已截断）';
        setProg('AI 解析中…');
        var r = await callFn('ai_parse', { text: textCtx });
        if(r.error){ toast(r.error,'err'); return; }
        overlay.remove();
        // 解析后的结构化字段经确认表单入库；所有选中文件在客户确认后保存：图片→照片，其他→附件
        var filesToSave = [];
        imgFiles.forEach(function(f){ filesToSave.push({kind:'photo', file:f}); });
        pdfFiles.concat(txtFiles, attachFiles).forEach(function(f){ filesToSave.push({kind:'attachment', file:f}); });
        openCustomerFormFromParsed(r.parsed || {}, filesToSave, textCtx);
      } catch(e){ toast(e.message,'err'); }
      finally { btn.disabled=false; btn.textContent='解析'; }
    }}, '解析'),
  ]));
  overlay.appendChild(m);
  overlay.addEventListener('click', function(e){ if(e.target===overlay) overlay.remove(); });
  document.getElementById('modal-root').appendChild(overlay);
}

async function openCustomerFormFromParsed(parsed, filesToSave, ocrRawText){
  // 剔除仅供展示的 OCR 字段，避免污染客户字段
  if(parsed && Object.prototype.hasOwnProperty.call(parsed,'ocr_text')) delete parsed.ocr_text;
  // AI 有时将 additional_info 输出为数组，统一转为换行分隔的字符串
  if(parsed && Array.isArray(parsed.additional_info)) parsed.additional_info = parsed.additional_info.join('\n');
  // 按姓名查找已有客户：同名则进入对比更新流程，否则直接新增
  var matches = [];
  var name = (parsed.customer_name || '').trim();
  if(name){
    try {
      var r = await callFn('customers', {action:'list', keyword:name, pageSize:100});
      var kw = name.toLowerCase();
      matches = (r.rows || []).filter(function(c){ return (c.customer_name||'').trim().toLowerCase() === kw; });
    } catch(e){ /* 查询失败时不阻塞新增流程 */ }
  }
  if(matches.length) openMergeCompareModal(parsed, matches, filesToSave, 0, ocrRawText);
  else openNewCustomerModal(parsed, filesToSave, ocrRawText);
}

// 保存解析选中的文件到 photos（图片→照片，其他→附件），
// 并将识别摘要与完整原文写入 ocr_records（关联本次保存成功的文件 id）
// customerSnapshot：AI 解析前客户信息快照（JSON 字符串），删除本 OCR 记录时可据此恢复
async function saveParsedFiles(customerId, filesToSave, ocrRawText, ocrSummary, customerSnapshot){
  var list = filesToSave || [];
  var savedIds = [], savedNames = [];
  var okCount=0, failCount=0;
  for(var i=0;i<list.length;i++){
    try {
      var b = await fileToBase64(list[i].file);
      var r = await callFn('photos', {action:'create', data:{customer_id:customerId, image_base64:b.base64, content_type:b.contentType, file_name:b.fileName, category:list[i].kind}});
      if(r && r.id){ savedIds.push(r.id); savedNames.push(list[i].file.name); }
      okCount++;
    } catch(e){ failCount++; }
  }
  if(okCount) toast('已保存 '+okCount+' 个文件到该客户');
  if(failCount) toast(failCount+' 个文件保存失败','err');
  if(ocrRawText && String(ocrRawText).trim()){
    try {
      await callFn('ocr_records', {action:'create', data:{
        customer_id: customerId,
        summary: ocrSummary || '',
        raw_text: String(ocrRawText),
        file_ids: JSON.stringify(savedIds),
        file_names: JSON.stringify(savedNames),
        customer_snapshot: customerSnapshot || null,
      }});
    } catch(e){ /* OCR 记录保存失败不阻塞主流程 */ }
  }
}

function openNewCustomerModal(parsed, filesToSave, ocrRawText){
  modal('确认客户信息（AI 解析结果）', CUSTOMER_FIELDS, parsed, async function(data){
    if(!data.customer_name){ toast('姓名必填','err'); return; }
    var r = await callFn('customers', {action:'create', data:data});
    toast('已创建 #'+r.id);
    await saveParsedFiles(r.id, filesToSave, ocrRawText, parsed.additional_info);
    location.hash = '#/customer/'+r.id;
  }, {nameDupCheck:true});
}

// 同名客户对比更新：差异表 + 合并预填表单，人工审核修订后提交更新
function openMergeCompareModal(parsed, matches, filesToSave, selIdx, ocrRawText){
  var oldC = matches[selIdx || 0];
  var overlay = el('div', {class:'modal-overlay'});
  var m = el('div', {class:'modal'});
  m.style.maxWidth = '760px';
  m.appendChild(el('h3', {}, '发现同名客户，请对比确认更新'));

  // 多个同名客户时可切换更新目标
  if(matches.length > 1){
    var sel = el('select', {style:'width:100%;padding:6px 10px;border:1px solid var(--border);border-radius:6px'});
    matches.forEach(function(c, i){
      var opt = el('option', {value:String(i)}, '#'+c.Id+' '+c.customer_name+(c.customer_stage?('（'+c.customer_stage+'）'):''));
      if(i === (selIdx||0)) opt.selected = true;
      sel.appendChild(opt);
    });
    sel.onchange = function(){
      overlay.remove();
      openMergeCompareModal(parsed, matches, filesToSave, parseInt(sel.value,10), ocrRawText);
    };
    m.appendChild(el('div', {class:'field'}, [el('label', {}, '存在多个同名客户，选择要更新的客户'), sel]));
  }

  // 计算差异：表单默认保留旧值，不直接覆盖；附加信息追加
  var formValues = {};
  var diffRows = [];
  var parseDate = new Date().toISOString().slice(0,10);
  CUSTOMER_FIELDS.forEach(function(f){
    var oldV = oldC[f.name] == null ? '' : String(oldC[f.name]);
    var newV = parsed[f.name] == null ? '' : String(parsed[f.name]);
    if(f.name === 'additional_info'){
      // 附加信息：保留原文 + =================== 分隔行 + 解析日期 + 新内容（追加，不替代）
      if(oldV && newV){
        formValues[f.name] = oldV + '\n\n===================\n\n[解析日期：' + parseDate + ']\n\n' + newV;
      } else {
        formValues[f.name] = newV || oldV;
      }
    } else {
      // 其他字段：默认保留旧值，操作者参照差异表手动决定是否更新
      formValues[f.name] = oldV;
    }
    if(newV && newV !== oldV) diffRows.push([f, oldV, newV]);
  });

  var tipText = diffRows.length
    ? '以下 '+diffRows.length+' 个字段有新的解析值（差异表已标出，下方表单默认保留原值，由操作者决定是否手动更新）：'
    : 'AI 解析未带来新的字段变化，可在下方表单中补充：';
  m.appendChild(el('p', {class:'diff-tip'}, tipText));
  if(diffRows.length){
    var table = el('table', {class:'diff-table'});
    table.appendChild(el('thead', {}, el('tr', {}, [el('th', {}, '字段'), el('th', {}, '现有值'), el('th', {}, 'AI 解析新值')])));
    var tbody = el('tbody', {});
    diffRows.forEach(function(row){
      var f=row[0], oldV=row[1], newV=row[2];
      var showNew = (f.name==='additional_info' && oldV && newV) ? newV+'\n（将以 =================== 分隔追加到现有内容后，并标注解析日期）' : (newV === '' ? '（空）' : newV);
      tbody.appendChild(el('tr', {}, [
        el('td', {class:'diff-field'}, f.label),
        el('td', {class:'diff-old'}, oldV === '' ? '（空）' : oldV),
        el('td', {class:'diff-new'}, showNew),
      ]));
    });
    table.appendChild(tbody);
    var wrap = el('div', {class:'diff-wrap'});
    wrap.appendChild(table);
    m.appendChild(wrap);
  }

  // 可编辑表单（默认保留旧值；附加信息已自动追加新内容+分隔线+解析日期）
  var formWrap = el('div', {});
  CUSTOMER_FIELDS.forEach(function(f){ formWrap.appendChild(makeField(f, formValues[f.name])); });
  m.appendChild(formWrap);
  // 姓名失焦查重：排除当前正在更新的客户
  attachNameDupCheck(formWrap, oldC.Id);

  m.appendChild(el('div', {class:'modal-footer'}, [
    el('button', {class:'btn', onclick:function(){ overlay.remove(); }}, '取消'),
    el('button', {class:'btn btn-primary', onclick:async function(){
      var btn = this; btn.disabled = true; btn.textContent = '提交中…';
      try {
        var raw = collectForm(m);
        if(!raw.customer_name){ toast('姓名必填','err'); return; }
        // 只传操作者改过的字段，没改过的不传 → 后端不动，彻底防止清零
        var data = {};
        CUSTOMER_FIELDS.forEach(function(f){
          var oldV = oldC[f.name] == null ? '' : String(oldC[f.name]);
          var newV = raw[f.name] == null ? '' : String(raw[f.name]);
          // additional_info 总是传（已做追加合并）；其他只有变化才传
          if(f.name === 'additional_info' || newV !== oldV){
            data[f.name] = newV;
          }
        });
        // 备份更新前的客户信息（快照），存入 OCR 记录，删除时可恢复
        var snapData = {};
        Object.keys(oldC).forEach(function(k){ if(k !== '_wb') snapData[k] = oldC[k]; });
        var snapshotJson = JSON.stringify(snapData);
        await callFn('customers', {action:'update', id: oldC.Id, data:data});
        toast('已更新客户 #'+oldC.Id);
        overlay.remove();
        await saveParsedFiles(oldC.Id, filesToSave, ocrRawText, parsed.additional_info, snapshotJson);
        invalidateCustomers();
        if(location.hash === '#/customer/'+oldC.Id) showDetail(oldC.Id);
        else location.hash = '#/customer/'+oldC.Id;
      } catch(e){ toast(e.message,'err'); }
      finally { btn.disabled = false; btn.textContent = '确认更新'; }
    }}, '确认更新'),
  ]));
  overlay.appendChild(m);
  overlay.addEventListener('click', function(e){ if(e.target===overlay) overlay.remove(); });
  document.getElementById('modal-root').appendChild(overlay);
}

// ==================== 工具 ====================
function debounce(fn, ms){
  var t; return function(){ var a=arguments, self=this; clearTimeout(t); t=setTimeout(function(){ fn.apply(self,a); }, ms); };
}

function openRecruitFollowupForm(candidateId, fol){
  var overlay = el('div', {style:'position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px'});
  var modalDiv = el('div', {class:'card', style:'max-width:500px;width:100%;max-height:85vh;overflow-y:auto;padding:20px'});
  modalDiv.appendChild(el('h2', {style:'margin-bottom:12px'}, fol ? '编辑跟进' : '新增跟进'));

  var fields = [
    {name:'followup_date', label:'跟进日期 *', type:'date'},
    {name:'contact_method', label:'接触方式', type:'select', options:[''].concat(RC_CONTACT_METHODS)},
    {name:'interest_level', label:'意向度', type:'select', options:[''].concat(RC_INTEREST_LEVELS)},
    {name:'followup_notes', label:'跟进内容', type:'textarea'},
    {name:'concern_feedback', label:'顾虑反馈', type:'textarea', placeholder:'对方顾虑变化（如薪酬/家庭/职业转型等）'},
    {name:'next_followup_date', label:'下次跟进日期', type:'date'},
    {name:'next_followup_goal', label:'下次跟进目标', type:'text'},
  ];
  var inputs = {};
  fields.forEach(function(f){
    var row = el('div', {style:'margin-bottom:8px'});
    row.appendChild(el('label', {style:'display:block;font-size:13px;color:var(--muted);margin-bottom:2px'}, f.label));
    var input;
    if(f.type === 'select'){
      input = el('select', {style:'width:100%;padding:6px 8px;border:1px solid var(--border);border-radius:4px;font-size:14px'});
      f.options.forEach(function(o){ input.appendChild(el('option', {value:o}, o || '— 请选择 —')); });
    } else if(f.type === 'textarea'){
      input = el('textarea', {style:'width:100%;padding:6px 8px;border:1px solid var(--border);border-radius:4px;font-size:14px;min-height:60px;resize:vertical'});
    } else {
      input = el('input', {type:f.type, style:'width:100%;padding:6px 8px;border:1px solid var(--border);border-radius:4px;font-size:14px'});
    }
    if(f.placeholder) input.placeholder = f.placeholder;
    if(fol && fol[f.name] != null) input.value = fol[f.name];
    inputs[f.name] = input;
    row.appendChild(input);
    modalDiv.appendChild(row);
  });

  var btnRow = el('div', {style:'display:flex;gap:8px;margin-top:12px'});
  var saveBtn = el('button', {class:'btn btn-primary'}, '保存');
  var cancelBtn = el('button', {class:'btn'}, '取消');
  btnRow.appendChild(cancelBtn);
  btnRow.appendChild(saveBtn);
  modalDiv.appendChild(btnRow);
  overlay.appendChild(modalDiv);
  document.body.appendChild(overlay);

  cancelBtn.onclick = function(){ overlay.remove(); };
  overlay.onclick = function(e){ if(e.target === overlay) overlay.remove(); };

  saveBtn.onclick = async function(){
    var data = {};
    for(var k in inputs){ data[k] = inputs[k].value.trim(); }
    if(!data.followup_date){ toast('请填写跟进日期','error'); return; }
    data.candidate_id = candidateId;
    data.operator = (CONFIG.operator && CONFIG.operator.name) || 'Victor';
    saveBtn.disabled = true; saveBtn.textContent = '保存中…';
    try {
      if(fol){
        var r = await callFn('recruit_followups', {action:'update', id:fol.id, data:data});
        if(r.error){ toast(r.error,'error'); saveBtn.disabled=false; saveBtn.textContent='保存'; return; }
        toast('已保存');
      } else {
        var r = await callFn('recruit_followups', {action:'create', data:data});
        if(r.error){ toast(r.error,'error'); saveBtn.disabled=false; saveBtn.textContent='保存'; return; }
        toast('已添加');
      }
      overlay.remove();
      showCandidateDetail(candidateId);
    } catch(e){
      toast(e.message,'error');
      saveBtn.disabled = false; saveBtn.textContent = '保存';
    }
  };
}
